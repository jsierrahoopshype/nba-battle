<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Race</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
canvas{border-radius:6px;cursor:default;position:relative;z-index:1}
#ui{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:50}
#ui button{background:rgba(20,20,50,.85);color:#ccd;border:1px solid rgba(100,140,255,.25);border-radius:8px;padding:8px 18px;font:700 14px system-ui;cursor:pointer;backdrop-filter:blur(6px)}
#ui button:hover{background:rgba(40,40,80,.95);border-color:rgba(100,140,255,.5)}
#recDot{display:none;position:fixed;top:14px;right:14px;width:14px;height:14px;background:#f33;border-radius:50%;z-index:20;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#modal-overlay.open{display:flex}
#modal{background:#0d1b3e;border:1px solid rgba(100,160,255,.25);border-radius:14px;width:92%;max-width:480px;max-height:88vh;overflow-y:auto;padding:20px;color:#cce}
#modal h2{text-align:center;font:700 22px system-ui;color:#87CEEB;margin-bottom:14px}
.pcard{background:rgba(10,20,50,.8);border:1px solid rgba(80,130,255,.2);border-radius:10px;padding:14px;margin-bottom:14px}
.pcard h3{font:700 15px system-ui;color:#9bc;margin-bottom:10px}
.pcard label{display:block;font:600 12px system-ui;color:#7a9cc0;margin:8px 0 3px}
.pcard input[type=text],.pcard input[type=url]{width:100%;background:#081228;border:1px solid rgba(80,130,255,.2);border-radius:6px;padding:7px 10px;color:#dde;font:13px system-ui;outline:none}
.pcard input:focus{border-color:rgba(100,160,255,.5)}
.pcard input[type=color]{width:40px;height:28px;border:1px solid rgba(80,130,255,.3);border-radius:4px;background:none;cursor:pointer;vertical-align:middle}
.pcard input[type=range]{width:100%;accent-color:#87CEEB}
.pcard .preview-row{display:flex;align-items:center;gap:10px}
.pcard .face-preview{width:40px;height:40px;border-radius:50%;border:2px solid #445;object-fit:cover;background:#081228;flex-shrink:0}
.pcard .file-btn{background:#142044;border:1px solid rgba(100,140,255,.25);border-radius:6px;padding:5px 12px;color:#9bc;font:600 12px system-ui;cursor:pointer}
.pcard .file-btn:hover{background:#1a2a55}
#search-box{width:100%;background:#081228;border:1px solid rgba(80,130,255,.2);border-radius:6px;padding:7px 10px;color:#dde;font:13px system-ui;outline:none;margin-bottom:6px}
#search-box:focus{border-color:rgba(100,160,255,.5)}
#search-results{max-height:180px;overflow-y:auto;margin-bottom:12px}
.sr-item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;font:13px system-ui;color:#bcd}
.sr-item:hover{background:rgba(80,130,255,.15)}
.sr-item img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#081228}
#modal .btn-row{display:flex;gap:10px;justify-content:center;margin-top:14px}
#modal .btn-row button{padding:10px 28px;border-radius:8px;border:none;font:700 15px system-ui;cursor:pointer}
#modal .btn-apply{background:#2a6fff;color:#fff}
#modal .btn-apply:hover{background:#3a7fff}
#modal .btn-cancel{background:#1a2040;color:#8ab;border:1px solid rgba(80,130,255,.25)}
#modal .btn-cancel:hover{background:#222a50}
.search-for{display:inline-block;font:600 12px system-ui;color:#9bc;background:#142044;border:1px solid rgba(100,140,255,.25);border-radius:6px;padding:5px 12px;margin-bottom:8px;cursor:pointer}
.search-for:hover{background:#1a2a55;border-color:rgba(100,140,255,.5);color:#87CEEB}
.search-for.active{background:#2a6fff;color:#fff;border-color:#2a6fff}
.cnt-row{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.cnt-btn{background:#142044;border:1px solid rgba(80,130,255,.2);border-radius:8px;padding:8px 14px;color:#9bc;font:700 13px system-ui;cursor:pointer;flex:1;text-align:center;transition:background .15s,border-color .15s}
.cnt-btn:hover{background:#1a2a55;border-color:rgba(100,140,255,.5)}
.cnt-btn.active{background:#2a6fff;color:#fff;border-color:#2a6fff}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<button onclick="restartRace()">⟳ RESTART</button>
<button onclick="openModal()">⚙ PLAYERS</button>
<button id="recBtn" onclick="toggleRec()">⏺ REC</button>
</div>
<div id="recDot"></div>
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
<div id="modal">
<h2>⚙ Configure Players</h2>
<div class="cnt-row">
<div class="cnt-btn active" onclick="setPlayerCount(2)">2</div>
<div class="cnt-btn" onclick="setPlayerCount(3)">3</div>
<div class="cnt-btn" onclick="setPlayerCount(4)">4</div>
<div class="cnt-btn" onclick="setPlayerCount(6)">6</div>
<div class="cnt-btn" onclick="setPlayerCount(8)">8</div>
</div>
<div id="player-cards"></div>
<div id="search-panel" style="display:none">
<h3 id="search-panel-title" style="font:700 14px system-ui;color:#87CEEB;margin-bottom:6px">Search NBA Players</h3>
<input type="text" id="search-box" placeholder="Type a player name..." oninput="filterPlayers(this.value)">
<div id="search-results"></div>
<button class="file-btn" style="margin-top:4px" onclick="hideSearch()">Cancel Search</button>
</div>
<div style="text-align:center;margin:10px 0">
<label style="font:600 13px system-ui;color:#9bc;cursor:pointer"><input type="checkbox" id="facesToggle" checked style="accent-color:#2a6fff;margin-right:6px">Show faces in balls</label>
</div>
<div class="btn-row">
<button class="btn-cancel" onclick="closeModal()">Cancel</button>
<button class="btn-apply" onclick="applyConfig()">Apply &amp; Restart</button>
</div>
</div>
</div>
<script>

// ════════════════════════════ CANVAS SETUP ════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 540, H = 960;
canvas.width = W; canvas.height = H;

function resize(){
  const s = Math.min(window.innerWidth/W, (window.innerHeight-60)/H);
  canvas.style.width = s*W+'px'; canvas.style.height = s*H+'px';
}
resize(); window.addEventListener('resize', resize);

// ════════════════════════════ SEEDED RNG ════════════════════════════
let _seed = CFG.seed;
function rng(){ _seed=((_seed*1103515245+12345)&0x7fffffff); return _seed/0x7fffffff; }
function rngRange(a,b){ return a+rng()*(b-a); }

// ════════════════════════════ LEVEL DESIGN ════════════════════════════
const FINISH_Y = 8800;
const LEVEL_H = 9000;
const BALL_RADIUS = 26;
const DANGER_ZONE_Y = 6000;

// ═══ Physics material profiles ═══
const MAT_BALL    = {restitution:0.38, friction:0.14, frictionAir:0.018, density:0.005};
const MAT_REDIR   = {restitution:0.25, friction:0.08};  // ramps, bouncePads, jawGate, pendulum
const MAT_POP     = {restitution:0.78, friction:0.01};  // bumpers, pegs
const MAT_CONTROL = {restitution:0.12, friction:0.35};  // conveyors, tiltPlatform, trapdoor, seesaw

// Standard obstacle params
const STD = {friction:MAT_REDIR.friction, restitution:MAT_REDIR.restitution, thickness:22, angle:0.611};

const SECTIONS = [
  // ══ SECTION 1: Opener — bouncePad guides + scattered bumpers ══

    id: 'opener', yStart: 150, yEnd: 900,
    obstacles: [
      // Left bouncePad angling balls toward center

      // Bumper between exit pads
      {type:'bumper', x:300, y:3450, radius:18, color:'#ff6600'}
    ]
  },
  // ══ SECTION 5: JawGate1 — bouncePad entry + jawGate + bumpers + bouncePad exit ══
  {
    id: 'jawgate1', yStart: 3650, yEnd: 4500,
    obstacles: [
      // Entry bouncePads
      {type:'bouncePad', x:80, y:3700, w:280, angle:STD.angle, thickness:STD.thickness},
      {type:'bouncePad', x:460, y:3900, w:280, angle:-STD.angle, thickness:STD.thickness},
      // Bumper between entry pads
      {type:'bumper', x:350, y:3800, radius:18, color:'#ff6600'},
      // JawGate at y:3950
      {type:'jawGate', x:270, y:3950, armLen:100, period:2.5},
      // 5 bumpers below gate
      {type:'bumper', x:140, y:4050, radius:18, color:'#ff8800'},
      {type:'bumper', x:400, y:4050, radius:18, color:'#ff8800'},
      {type:'bumper', x:270, y:4120, radius:20, color:'#ff4400'},
      {type:'bumper', x:160, y:4200, radius:16, color:'#ff6600'},
      {type:'bumper', x:380, y:4200, radius:16, color:'#ff6600'},
      // Exit bouncePads
      {type:'bouncePad', x:80, y:4300, w:280, angle:STD.angle, thickness:STD.thickness},
      {type:'bouncePad', x:460, y:4500, w:280, angle:-STD.angle, thickness:STD.thickness}
    ]
  },
  // ══ SECTION 6: Double Sweeper — 2 counter-rotating sweepers + bumpers ══
  {
    id: 'double_sweeper', yStart: 4550, yEnd: 5500,
    obstacles: [
      // Entry bumper
      {type:'bumper', x:270, y:4600, radius:20, color:'#ff6600'},
      // Sweeper 1 at y:4700 (clockwise)
      {type:'sweeper', x:270, y:4700, w:180, speed:0.012},

  // ══ SECTION 9: Finish — pendulum + jawGate + bumpers + narrow chute ══
  {

      {type:'bumper', x:420, y:7750, radius:18, color:'#ff4400'},

      {type:'jawGate', x:270, y:7900, armLen:110, period:1.8},
      // 2 more bumpers below gate

      {type:'bumper', x:360, y:8050, radius:20, color:'#ff2200'},

];

function obstacleFactory(spec, courseScale){
  const {Bodies, Constraint} = Matter;
  const result = {body:null, paddle:false, oscgate:false, constraint:null, extraBodies:[], extraPaddles:[]};
  const cs = courseScale || 1;
  const mid = W / 2; // 270

  // Scale x position toward center proportionally
  function sx(x){ return mid + (x - mid) * cs; }

  switch(spec.type){
    case 'ramp': {
      const slopeT = spec.thickness || 22;
      const scaledW = spec.w * cs;
      const baseX = sx(spec.x);
      result.body = Bodies.rectangle(
        baseX + (spec.angle>0?scaledW/2:-scaledW/2), spec.y, scaledW, slopeT,
        {isStatic:true, restitution:spec.restitution!==undefined?spec.restitution:MAT_REDIR.restitution,
         friction:spec.friction!==undefined?spec.friction:MAT_REDIR.friction, angle:spec.angle, label:'slope'}
      );
      result.body._w = scaledW;
      result.body._h = slopeT;
      break;
    }
    case 'peg': {
      const r = spec.r || 10;
      result.body = Bodies.circle(sx(spec.x), spec.y, r, {
        isStatic:true, restitution:MAT_POP.restitution,
        friction:MAT_POP.friction, label:'peg', _pegR:r
      });
      break;
    }
    case 'floor': {
      const scaledW = spec.w * cs;
      result.body = Bodies.rectangle(sx(spec.x), spec.y, scaledW, spec.h, {isStatic:true, restitution:0.3, label:'floor'});
      result.body._w = scaledW;
      result.body._h = spec.h;
      break;
    }
    case 'wall': {
      result.body = Bodies.rectangle(spec.x, spec.y, spec.w, spec.h, {isStatic:true, label:'wall'});
      result.body._w = spec.w;
      result.body._h = spec.h;
      break;
    }
    case 'sweeper': {
      const swW = (spec.w || 180) * cs;
      result.body = Bodies.rectangle(sx(spec.x), spec.y, swW, 22, {
        isStatic:true, restitution:MAT_REDIR.restitution, friction:MAT_REDIR.friction, label:'paddle'
      });
      result.body._rotSpeed = spec.speed || 0.02;
      result.body._w = swW;
      result.body._h = 22;
      result.paddle = true;
      break;
    }
    case 'seesaw': {
      const ssW = (spec.w || 280) * cs;
      const ssX = sx(spec.x);
      result.body = Bodies.rectangle(ssX, spec.y, ssW, 22, {
        isStatic:false, restitution:MAT_CONTROL.restitution, friction:MAT_CONTROL.friction, frictionAir:0.05,
        density:0.01, label:'seesaw'
      });
      result.body._w = ssW;
      result.body._h = 22;
      result.constraint = Constraint.create({
        pointA:{x:ssX, y:spec.y}, bodyB:result.body,
        pointB:{x:0, y:0}, stiffness:1, length:0
      });
      break;
    }
    case 'gate': {
      const gW = (spec.w || 80) * cs;
      const gH = spec.h || 22;
      const gX = sx(spec.x);
      result.body = Bodies.rectangle(gX, spec.y, gW, gH, {
        isStatic:true, restitution:0.3, friction:0.1, label:'oscgate'
      });
      result.body._w = gW;
      result.body._h = gH;
      result.body._oscXCenter = sx((spec.xMin + spec.xMax) / 2);
      result.body._oscXRange = ((spec.xMax - spec.xMin) / 2) * cs;
      result.body._oscY = spec.y;
      result.body._oscPeriod = spec.period || 3;
      result.body._oscPhase = spec.phase || 0;
      result.oscgate = true;
      break;
    }
    case 'bumper': {
      const br = spec.radius || 20;
      const bColor = spec.color || '#ff6600';
      result.body = Bodies.circle(sx(spec.x), spec.y, br, {
        isStatic:true, restitution:MAT_POP.restitution, friction:MAT_POP.friction, label:'bumper', _bumperR:br, _bumperColor:bColor
      });
      break;
    }
    case 'bouncePad': {
      const slopeT = spec.thickness || 22;
      const scaledW = spec.w * cs;
      const baseX = sx(spec.x);
      result.body = Bodies.rectangle(
        baseX + (spec.angle>0?scaledW/2:-scaledW/2), spec.y, scaledW, slopeT,
        {isStatic:true, restitution:MAT_REDIR.restitution, friction:MAT_REDIR.friction, angle:spec.angle, label:'bouncePad'}
      );
      result.body._w = scaledW;
      result.body._h = slopeT;
      break;
    }
    case 'spinner': {
      const spX = sx(spec.x);
      const armLen = 80 * cs;
      const armT = 14;
      const spd = spec.speed || 0.025;
      // Create 3 arms at 0, 120, 240 degrees
      for(let a=0; a<3; a++){
        const angle = (a * Math.PI * 2) / 3;
        const arm = Bodies.rectangle(spX, spec.y, armLen, armT, {
          isStatic:true, restitution:MAT_REDIR.restitution, friction:MAT_REDIR.friction, label:'spinner', angle:angle
        });
        arm._rotSpeed = spd;
        arm._w = armLen;
        arm._h = armT;
        arm._spinCenterX = spX;
        arm._spinCenterY = spec.y;
        if(a === 0){
          result.body = arm;
          result.paddle = true;
        } else {
          result.extraBodies.push(arm);
          result.extraPaddles.push(arm);
        }
      }
      break;
    }
    case 'trapdoor': {
      const tdW = (spec.w || 200) * cs;
      const gap = (spec.gap || 40) * cs;
      const tdX = sx(spec.x);
      const halfW = (tdW - gap) / 2;
      const tdH = 18;
      // Left platform
      const leftBody = Bodies.rectangle(tdX - gap/2 - halfW/2, spec.y, halfW, tdH, {
        isStatic:true, restitution:MAT_CONTROL.restitution, friction:MAT_CONTROL.friction, label:'trapdoor'
      });
      leftBody._w = halfW; leftBody._h = tdH;
      leftBody._tdOpen = false; leftBody._tdTimer = 0; leftBody._tdHoldTime = spec.holdTime || 2;
      leftBody._tdOpenDur = spec.openDur || 1.5;
      // Right platform
      const rightBody = Bodies.rectangle(tdX + gap/2 + halfW/2, spec.y, halfW, tdH, {
        isStatic:true, restitution:MAT_CONTROL.restitution, friction:MAT_CONTROL.friction, label:'trapdoor'
      });
      rightBody._w = halfW; rightBody._h = tdH;
      rightBody._tdOpen = false; rightBody._tdTimer = 0; rightBody._tdHoldTime = spec.holdTime || 2;
      rightBody._tdOpenDur = spec.openDur || 1.5;
      // Link them for synchronized opening
      leftBody._tdPartner = rightBody;
      rightBody._tdPartner = leftBody;
      result.body = leftBody;
      result.extraBodies.push(rightBody);
      result.trapdoor = [leftBody, rightBody];
      break;
    }
    case 'pendulum': {
      const pLen = (spec.length || 120) * cs;
      const pX = sx(spec.x);
      const pW = 20, pH = pLen;
      const anchorY = spec.y;
      const bodyY = anchorY + pLen / 2;
      const pendBody = Bodies.rectangle(pX, bodyY, pW, pH, {
        isStatic:false, restitution:MAT_REDIR.restitution, friction:MAT_REDIR.friction, density:0.05, frictionAir:0.005,
        label:'pendulum'
      });
      pendBody._w = pW; pendBody._h = pH;
      pendBody._anchorX = pX; pendBody._anchorY = anchorY;
      result.body = pendBody;
      result.pendulum = true;
      result.constraint = Constraint.create({
        pointA:{x:pX, y:anchorY}, bodyB:pendBody,
        pointB:{x:0, y:-pLen/2}, stiffness:1, length:0
      });
      // Give initial angular push
      Body.setAngularVelocity(pendBody, spec.initSpin || 0.03);
      break;
    }
    case 'conveyorStrip': {
      // Conveyor obstacle fully removed — skip creation
      break;
    }
    case 'tiltPlatform': {
      const tpW = (spec.w || 240) * cs;
      const tpH = 20;
      const tpX = sx(spec.x);
      const tpBody = Bodies.rectangle(tpX, spec.y, tpW, tpH, {
        isStatic:true, restitution:MAT_CONTROL.restitution, friction:MAT_CONTROL.friction, label:'tiltPlatform'
      });
      tpBody._w = tpW; tpBody._h = tpH;
      tpBody._tiltDir = spec.tiltDir === 'left' ? -1 : 1;
      tpBody._tiltMaxAngle = 0.611; // 35 degrees
      tpBody._tiltPhase = 'flat'; // flat, tilting, held, resetting
      tpBody._tiltTimer = 0;
      tpBody._tiltFlatDur = 3;    // seconds flat before tilting
      tpBody._tiltDur = 1.5;      // seconds to tilt
      tpBody._tiltHoldDur = 2.5;  // seconds held at angle
      tpBody._tiltResetDur = 1.5; // seconds to reset
      tpBody._pivotX = tpX;
      tpBody._pivotY = spec.y;
      result.body = tpBody;
      result.tiltPlatform = true;
      break;
    }
    case 'baitFunnel': {
      const bfX = sx(spec.x);
      const bfW = (spec.w || 400) * cs;
      const wallH = 80;
      const centerGap = 60 * cs;
      const sideGap = 120 * cs;
      const wallT = 18;
      // Left outer wall
      const leftOuter = Bodies.rectangle(bfX - bfW/2, spec.y, wallT, wallH, {
        isStatic:true, restitution:MAT_REDIR.restitution, friction:MAT_REDIR.friction, label:'baitFunnel'
      });
      leftOuter._w = wallT; leftOuter._h = wallH;
      // Left inner wall — forms center channel
      const liX = bfX - centerGap/2;
      const leftInner = Bodies.rectangle(liX, spec.y, wallT, wallH, {
        isStatic:true, restitution:MAT_CONTROL.restitution, friction:MAT_CONTROL.friction, label:'baitFunnelCenter'
      });
      leftInner._w = wallT; leftInner._h = wallH;
      leftInner._bfSide = -1;
      leftInner._bfBaseX = liX;
      leftInner._bfBaseY = spec.y;
      leftInner._bfReleasing = false;
      // Right inner wall
      const riX = bfX + centerGap/2;
      const rightInner = Bodies.rectangle(riX, spec.y, wallT, wallH, {
        isStatic:true, restitution:MAT_CONTROL.restitution, friction:MAT_CONTROL.friction, label:'baitFunnelCenter'
      });
      rightInner._w = wallT; rightInner._h = wallH;
      rightInner._bfSide = 1;
      rightInner._bfBaseX = riX;
      rightInner._bfBaseY = spec.y;
      rightInner._bfReleasing = false;
      // Right outer wall
      const rightOuter = Bodies.rectangle(bfX + bfW/2, spec.y, wallT, wallH, {
        isStatic:true, restitution:MAT_REDIR.restitution, friction:MAT_REDIR.friction, label:'baitFunnel'
      });
      rightOuter._w = wallT; rightOuter._h = wallH;
      // Gold floor in center channel to bait players
      const goldFloor = Bodies.rectangle(bfX, spec.y + wallH/2, centerGap + wallT, 12, {
        isStatic:true, restitution:MAT_CONTROL.restitution, friction:MAT_CONTROL.friction, label:'baitFunnelGold'
      });
      goldFloor._w = centerGap + wallT; goldFloor._h = 12;
      // Link inner walls for release mechanism
      leftInner._bfPartner = rightInner;
      rightInner._bfPartner = leftInner;
      leftInner._bfCenterX = bfX;
      rightInner._bfCenterX = bfX;
      result.body = leftOuter;
      result.extraBodies.push(leftInner, rightInner, rightOuter, goldFloor);
      result.baitFunnel = true;
      // Store inner walls for animation
      result.body._bfInnerWalls = [leftInner, rightInner];
      break;
    }
    case 'jawGate': {
      const jX = sx(spec.x);
      const armLen = (spec.armLen || 100) * cs;
      const armT = 16;
      const period = spec.period || 3;
      // Left jaw — anchored at left edge
      const leftJaw = Bodies.rectangle(jX - armLen/2, spec.y, armLen, armT, {
        isStatic:true, restitution:MAT_REDIR.restitution, friction:MAT_REDIR.friction, label:'jawgate'
      });
      leftJaw._w = armLen; leftJaw._h = armT;
      leftJaw._jawSide = -1; leftJaw._jawCenterX = jX;
      leftJaw._jawBaseX = jX - armLen; leftJaw._jawBaseY = spec.y;
      leftJaw._jawPeriod = period; leftJaw._jawLen = armLen;
      // Right jaw — anchored at right edge
      const rightJaw = Bodies.rectangle(jX + armLen/2, spec.y, armLen, armT, {
        isStatic:true, restitution:MAT_REDIR.restitution, friction:MAT_REDIR.friction, label:'jawgate'
      });
      rightJaw._w = armLen; rightJaw._h = armT;
      rightJaw._jawSide = 1; rightJaw._jawCenterX = jX;
      rightJaw._jawBaseX = jX + armLen; rightJaw._jawBaseY = spec.y;
      rightJaw._jawPeriod = period; rightJaw._jawLen = armLen;
      result.body = leftJaw;
      result.extraBodies.push(rightJaw);
      result.jawgate = [leftJaw, rightJaw];
      break;
    }
  }
  return result;
}

function buildLevel(courseScale){
  const allBodies = [], paddles = [], gates = [], constraints = [];

  // Process all sections
  SECTIONS.forEach(section => {
    section.obstacles.forEach(spec => {
      const res = obstacleFactory(spec, courseScale);
      if(res.body){
        allBodies.push(res.body);
        if(res.paddle) paddles.push(res.body);
        if(res.oscgate) gates.push(res.body);
        if(res.constraint) constraints.push(res.constraint);
        if(res.trapdoor) trapdoorBodies.push(...res.trapdoor);
        if(res.pendulum) pendulumBodies.push(res.body);
        // conveyorBodies push removed — conveyors fully disabled
        if(res.jawgate) jawGateBodies.push(...res.jawgate);
        if(res.tiltPlatform) tiltPlatformBodies.push(res.body);
        if(res.baitFunnel) baitFunnelBodies.push(res.body);
      }
      if(res.extraBodies.length){
        res.extraBodies.forEach(eb => allBodies.push(eb));
        res.extraPaddles.forEach(ep => paddles.push(ep));
      }
      if(res.extraConstraints){
        res.extraConstraints.forEach(c => constraints.push(c));
      }
    });
  });

  // Boundaries — walls flush at x=0 and x=540
  const wallSpecs = [
    {type:'wall', x:-10, y:LEVEL_H/2, w:20, h:LEVEL_H},
    {type:'wall', x:W+10, y:LEVEL_H/2, w:20, h:LEVEL_H},
    {type:'floor', x:W/2, y:FINISH_Y+100, w:W, h:40}
  ];
  wallSpecs.forEach(spec => {
    const res = obstacleFactory(spec, courseScale);
    if(res.body) allBodies.push(res.body);
  });

  return {bodies:allBodies, paddles, gates, constraints};
}

// ════════════════════════════ MATTER.JS SETUP ════════════════════════════
const {Engine, World, Bodies, Body, Composite, Events, Constraint} = Matter;
let engine, world, tokenBodies=[], obsBodies=[], paddleBodies=[], oscGateBodies=[];
let trapdoorBodies=[], pendulumBodies=[], conveyorBodies=[], jawGateBodies=[];
let tiltPlatformBodies=[], baitFunnelBodies=[];

function createPhysics(){
  // Gravity scales with player count — higher = faster falling
  const grav = CFG.playerCount <= 2 ? 1.1 : CFG.playerCount <= 4 ? 1.2 : 1.3;
  if(!engine){
    engine = Engine.create({gravity:{x:0, y:grav}});
  } else {
    Composite.clear(engine.world);
    engine.gravity.y = grav;
  }
  world = engine.world;
  tokenBodies = [];
  obsBodies = [];
  paddleBodies = [];
  oscGateBodies = [];
  trapdoorBodies = [];
  pendulumBodies = [];
  conveyorBodies = [];
  jawGateBodies = [];
  tiltPlatformBodies = [];
  baitFunnelBodies = [];

  // Tokens — spread evenly across width at same Y
  const n = CFG.playerCount;
  for(let i=0; i<n; i++){
    const x = (W/(n+1))*(i+1);
    const tb = Bodies.circle(x, 80, BALL_RADIUS, {
      restitution:MAT_BALL.restitution, friction:MAT_BALL.friction,
      frictionAir:MAT_BALL.frictionAir, density:MAT_BALL.density, label:'p'+i,
      collisionFilter:{group:-(i+1)}
    });
    tokenBodies.push(tb);
    World.add(world, tb);
  }

  // Build level from data-driven sections
  const courseScale = CFG.playerCount <= 2 ? 1.0 : CFG.playerCount <= 4 ? 1.35 : 1.7;
  const level = buildLevel(courseScale);
  obsBodies = level.bodies;
  paddleBodies = level.paddles;
  oscGateBodies = level.gates;

  World.add(world, obsBodies);
  level.constraints.forEach(c => World.add(world, c));
  console.log('[marble-race] conveyorBodies.length after buildLevel:', conveyorBodies.length);
}

const imgs = {};

function loadImg(key, url, name){
  const img = new Image();
  img.crossOrigin = 'anonymous';
  let done = false;
  const timeout = setTimeout(()=>{
    if(!done){ done = true; imgs[key] = null; imgsLoaded++; console.log(`[IMG] ${name} FAILED — timeout`); }
  }, 3000);
  img.onload = ()=>{ if(!done){ done = true; clearTimeout(timeout); imgs[key] = img; imgsLoaded++; console.log(`[IMG] ${name} loaded OK`); } };
  img.onerror = ()=>{ if(!done){ done = true; clearTimeout(timeout); imgs[key] = null; imgsLoaded++; console.log(`[IMG] ${name} FAILED — using initials`); } };
  img.src = url;
}
function loadAllPlayerImgs(){
  imgsLoaded = 0;
  // Always preload all 8 default headshots on startup
  const count = CFG.players.length;
  for(let i=0; i<count; i++){
    loadImg('p'+i, CFG.players[i].img, CFG.players[i].name);
  }
}

// ════════════════════════════ PARTICLES ════════════════════════════
let particles = [];

function spawnHitParticles(x, y, color){
  for(let i=0; i<6; i++){
    const a = Math.random()*Math.PI*2, spd = 1+Math.random()*3;
    particles.push({
      x, y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-1,
      size:2+Math.random()*3, color, life:1
    });
  }
}

function updateParticles(dt){
  for(let i=particles.length-1; i>=0; i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.08;
    p.life -= dt*2.5;
    if(p.life<=0) particles.splice(i,1);
  }
}

// ════════════════════════════ COLLISION EVENTS ════════════════════════════
function setupCollisionEvents(){
  Events.on(engine, 'collisionStart', (e)=>{
    e.pairs.forEach(pair=>{
      const labels = [pair.bodyA.label, pair.bodyB.label];
      let tokenBody = null, color = '';
      for(let i=0; i<CFG.playerCount; i++){
        const lbl = 'p'+i;
        if(labels.includes(lbl)){
          tokenBody = pair.bodyA.label===lbl ? pair.bodyA : pair.bodyB;
          color = CFG.players[i].color;
          break;
        }
      }
      if(tokenBody && (labels.includes('peg')||labels.includes('floor')||labels.includes('slope')||labels.includes('paddle')||labels.includes('seesaw')||labels.includes('oscgate')||labels.includes('bumper')||labels.includes('bouncePad')||labels.includes('spinner')||labels.includes('tiltPlatform')||labels.includes('baitFunnel')||labels.includes('baitFunnelCenter')||labels.includes('baitFunnelGold')||labels.includes('jawgate')||labels.includes('conveyor')||labels.includes('pendulum')||labels.includes('trapdoor'))){
        spawnHitParticles(tokenBody.position.x, tokenBody.position.y, color);
      }
    });
  });
}

// ════════════════════════════ DRAWING ════════════════════════════
function drawBackground(){
  // Sky gradient
  const gy = -camY*0.05;
  const grad = ctx.createLinearGradient(0, gy, 0, gy+H*1.5);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(0.5, '#B0E0FF');
  grad.addColorStop(1, '#E8F4FF');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Radial depth — darker blue in center for tube feel
  ctx.save();
  const rg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
  rg.addColorStop(0, 'rgba(30,60,100,0.12)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // Clouds parallax
  ctx.save();
  clouds.forEach(c=>{
    const cy = (c.y - camY*0.3) % (H+c.h*2) - c.h;
    ctx.globalAlpha = c.alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(c.x, cy, c.w/2, c.h/2, 0, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
}

function drawObstacles(){
  ctx.save();
  ctx.translate(0, -camY);

  obsBodies.forEach(b=>{
    if(b.label==='wall') return;
    const pos = b.position;

    // Skip if off-screen
    if(pos.y < camY-100 || pos.y > camY+H+100) return;

    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.rotate(b.angle);

    // ── CAT 3: HARD POP HAZARDS — electric blue, pulsing glow ──
    if(b.label==='peg'){
      const r = b._pegR || 12;
      const pulse = 10 + 6 * Math.sin(Date.now()/300);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);
      ctx.fillStyle = '#0066ff';
      ctx.shadowColor = '#0044cc'; ctx.shadowBlur = pulse;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    } else if(b.label==='bumper'){
      const br = b._bumperR || 20;
      const pulse = 10 + 6 * Math.sin(Date.now()/300);
      ctx.beginPath(); ctx.arc(0, 0, br, 0, Math.PI*2);
      ctx.fillStyle = '#0066ff';
      ctx.shadowColor = '#0044cc'; ctx.shadowBlur = pulse;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

    // ── CAT 3 (active): MACHINERY — charcoal body, red tips, white pivot ──
    } else if(b.label==='paddle'){
      const armW = b._w || 180, armH = b._h || 22, tipLen = 25;
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.roundRect(-armW/2, -armH/2, armW, armH, 4); ctx.fill();
      ctx.fillStyle = '#ff2200';
      ctx.beginPath(); ctx.roundRect(-armW/2, -armH/2, tipLen, armH, [4,0,0,4]); ctx.fill();
      ctx.beginPath(); ctx.roundRect(armW/2 - tipLen, -armH/2, tipLen, armH, [0,4,4,0]); ctx.fill();
      ctx.strokeStyle = 'rgba(255,34,0,.3)'; ctx.lineWidth = 1;
      ctx.strokeRect(-armW/2, -armH/2, armW, armH);
      // White pivot (un-rotated)
      ctx.restore(); ctx.save(); ctx.translate(pos.x, pos.y);
      ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI*2);
      ctx.fillStyle = '#fff'; ctx.fill();
      ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 2; ctx.stroke();
    } else if(b.label==='spinner'){
      const armW = b._w || 80, armH = b._h || 14, tipLen = 15;
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.roundRect(-armW/2, -armH/2, armW, armH, 3); ctx.fill();
      ctx.fillStyle = '#ff2200';
      ctx.beginPath(); ctx.roundRect(-armW/2, -armH/2, tipLen, armH, [3,0,0,3]); ctx.fill();
      ctx.beginPath(); ctx.roundRect(armW/2 - tipLen, -armH/2, tipLen, armH, [0,3,3,0]); ctx.fill();
      ctx.strokeStyle = 'rgba(255,34,0,.3)'; ctx.lineWidth = 1;
      ctx.strokeRect(-armW/2, -armH/2, armW, armH);
    } else if(b.label==='jawgate'){
      const jW = b._w || 100, jH = b._h || 16, tipLen = 18;
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.roundRect(-jW/2, -jH/2, jW, jH, 3); ctx.fill();
      // Red tip on the inner (biting) end
      const innerSide = b._jawSide || -1;
      if(innerSide < 0){
        ctx.fillStyle = '#ff2200';
        ctx.beginPath(); ctx.roundRect(jW/2 - tipLen, -jH/2, tipLen, jH, [0,3,3,0]); ctx.fill();
      } else {
        ctx.fillStyle = '#ff2200';
        ctx.beginPath(); ctx.roundRect(-jW/2, -jH/2, tipLen, jH, [3,0,0,3]); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(255,34,0,.3)'; ctx.lineWidth = 1;
      ctx.strokeRect(-jW/2, -jH/2, jW, jH);
    } else if(b.label==='pendulum'){
      const pW = b._w || 20, pH = b._h || 120;
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.roundRect(-pW/2, -pH/2, pW, pH, 4); ctx.fill();
      // Red tip at bottom
      ctx.fillStyle = '#ff2200';
      ctx.beginPath(); ctx.roundRect(-pW/2, pH/2 - 25, pW, 25, [0,0,4,4]); ctx.fill();
      ctx.strokeStyle = 'rgba(255,34,0,.3)'; ctx.lineWidth = 1;
      ctx.strokeRect(-pW/2, -pH/2, pW, pH);
      // White anchor (un-rotated)
      ctx.restore(); ctx.save(); ctx.translate(b._anchorX, b._anchorY);
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2);
      ctx.fillStyle = '#fff'; ctx.fill();
      ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 2; ctx.stroke();

    // ── CAT 4: CONTROL SURFACES — warm amber, functional look ──
    } else if(b.label==='seesaw'){
      const plankW = b._w || 280, plankH = b._h || 22;
      ctx.fillStyle = '#c17f24';
      ctx.beginPath(); ctx.roundRect(-plankW/2, -plankH/2, plankW, plankH, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(160,105,20,.5)'; ctx.lineWidth = 1.5;
      ctx.strokeRect(-plankW/2, -plankH/2, plankW, plankH);
      // Triangle pivot (un-rotated)
      ctx.restore(); ctx.save(); ctx.translate(pos.x, pos.y);
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(14, 0); ctx.lineTo(0, 22); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(193,127,36,.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    } else if(b.label==='tiltPlatform'){
      const tpW = b._w || 240, tpH = b._h || 20;
      ctx.fillStyle = '#c17f24';
      ctx.beginPath(); ctx.roundRect(-tpW/2, -tpH/2, tpW, tpH, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(160,105,20,.5)'; ctx.lineWidth = 1.5;
      ctx.strokeRect(-tpW/2, -tpH/2, tpW, tpH);
      // Orange pivot dot
      ctx.fillStyle = '#ff8800';
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
      // Direction arrow
      const dir = b._tiltDir || 1;
      ctx.strokeStyle = 'rgba(255,136,0,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(dir * 20, -tpH/2 - 6);
      ctx.lineTo(dir * 35, -tpH/2 - 6);
      ctx.lineTo(dir * 30, -tpH/2 - 12);
      ctx.stroke();
    } else if(b.label==='trapdoor'){
      const tdW = b._w || 80, tdH = b._h || 18;
      const isOpen = b._tdOpen;
      ctx.fillStyle = isOpen ? 'rgba(193,127,36,0.3)' : '#c17f24';
      ctx.beginPath(); ctx.roundRect(-tdW/2, -tdH/2, tdW, tdH, 3); ctx.fill();
      if(!isOpen){
        const warn = b._tdTimer / b._tdHoldTime;
        if(warn > 0.5){
          const glow = (warn - 0.5) * 2;
          ctx.strokeStyle = `rgba(255,100,0,${glow * 0.8})`;
          ctx.lineWidth = 2;
          ctx.shadowColor = '#ff6600'; ctx.shadowBlur = glow * 15;
          ctx.strokeRect(-tdW/2, -tdH/2, tdW, tdH);
          ctx.shadowBlur = 0;
        } else {
          ctx.strokeStyle = 'rgba(160,105,20,.5)'; ctx.lineWidth = 1;
          ctx.strokeRect(-tdW/2, -tdH/2, tdW, tdH);
        }
      }

    // ── CAT 4 (trap): BAIT FUNNEL — outer = slate redirect, inner = amber control ──
    } else if(b.label==='baitFunnel'){
      const bfW = b._w || 18, bfH = b._h || 80;
      ctx.fillStyle = '#2c3e50';
      ctx.fillRect(-bfW/2, -bfH/2, bfW, bfH);
      ctx.strokeStyle = '#5d7a8a'; ctx.lineWidth = 2;
      ctx.strokeRect(-bfW/2, -bfH/2, bfW, bfH);
    } else if(b.label==='baitFunnelCenter'){
      const bfW = b._w || 18, bfH = b._h || 80;
      ctx.fillStyle = '#c17f24';
      ctx.fillRect(-bfW/2, -bfH/2, bfW, bfH);
      ctx.strokeStyle = '#daa530'; ctx.lineWidth = 1.5;
      ctx.shadowColor = '#c17f24'; ctx.shadowBlur = 6;
      ctx.strokeRect(-bfW/2, -bfH/2, bfW, bfH);
      ctx.shadowBlur = 0;
    } else if(b.label==='baitFunnelGold'){
      const gfW = b._w || 60, gfH = b._h || 12;
      ctx.fillStyle = '#c17f24';
      ctx.shadowColor = '#c17f24'; ctx.shadowBlur = 8;
      ctx.fillRect(-gfW/2, -gfH/2, gfW, gfH);
      ctx.shadowBlur = 0;
    } else if(b.label==='oscgate'){
      // Oscillating gate — control surface style
      const gateW = b._w || 80, gateH = b._h || 22;
      ctx.fillStyle = '#c17f24';
      ctx.fillRect(-gateW/2, -gateH/2, gateW, gateH);
      ctx.strokeStyle = 'rgba(160,105,20,.5)'; ctx.lineWidth = 1.5;
      ctx.strokeRect(-gateW/2, -gateH/2, gateW, gateH);

    // ── CAT 2: REDIRECT RAMPS / BOUNCEPADS — deep slate ──
    } else if(b.label==='bouncePad'){
      const bpW = b._w || 60, bpH = b._h || 22;
      ctx.fillStyle = '#2c3e50';
      ctx.fillRect(-bpW/2, -bpH/2, bpW, bpH);
      // Top-face highlight
      ctx.strokeStyle = '#5d7a8a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-bpW/2, -bpH/2); ctx.lineTo(bpW/2, -bpH/2); ctx.stroke();
    } else {
      // Default — slopes, floors: deep slate redirect style
      const bw = b._w || 60, bh = b._h || 22;
      ctx.fillStyle = '#2c3e50';
      ctx.fillRect(-bw/2, -bh/2, bw, bh);
      // Top-face highlight
      ctx.strokeStyle = '#5d7a8a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-bw/2, -bh/2); ctx.lineTo(bw/2, -bh/2); ctx.stroke();
    }
    ctx.restore();
  });

  // Finish line — bold checkered pattern with neon green glow
  const fy = FINISH_Y - camY;
  if(fy > -80 && fy < H+80){
    // Neon green glow line above checker strip
    ctx.save();
    ctx.strokeStyle = '#00ff66';
    ctx.shadowColor = '#00ff66'; ctx.shadowBlur = 18;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, FINISH_Y - 4); ctx.lineTo(W, FINISH_Y - 4); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
    // Checkered pattern
    const checkSize = 20;
    for(let cx=0; cx<W; cx+=checkSize){
      for(let r=0; r<3; r++){
        const isBlack = (Math.floor(cx/checkSize)+r)%2===0;
        ctx.fillStyle = isBlack ? '#111' : '#fff';
        ctx.fillRect(cx, FINISH_Y+r*checkSize, checkSize, checkSize);
      }
    }
    ctx.save();
    // Dark pill background behind text
    ctx.font = '900 36px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    const txtW = ctx.measureText('FINISH').width;
    const pillW = txtW + 30, pillH = 44;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.beginPath();
    ctx.roundRect(W/2 - pillW/2, FINISH_Y - 12 - pillH, pillW, pillH, 10);
    ctx.fill();
    // Bright white text with dark stroke
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.strokeText('FINISH', W/2, FINISH_Y - 16);
    ctx.fillText('FINISH', W/2, FINISH_Y - 16);
    ctx.restore();
  }

  ctx.restore();
}

function drawToken(body, cfg, idx){
  const px = body.position.x;
  const py = body.position.y - camY;

  // Skip if off-screen
  if(py < -60 || py > H+60) return;

  const r = BALL_RADIUS;
  const speed = Math.sqrt(body.velocity.x*body.velocity.x + body.velocity.y*body.velocity.y);
  const fast = speed > 8;

  // Speed trail — fading circles from trail history
  const trail = trailHistory[idx];
  if(trail.length > 1){
    ctx.save();
    ctx.fillStyle = cfg.color;
    const len = trail.length;
    for(let i=0; i<len-1; i++){
      const t = i / (len - 1); // 0 (oldest) to ~1 (newest)
      const baseAlpha = 0.1 + t * 0.5; // 0.1 to 0.6
      ctx.globalAlpha = fast ? Math.min(1, baseAlpha * 1.5) : baseAlpha;
      const trailR = r * (0.3 + t * 0.5); // shrinks for older positions
      const tx = trail[i].x;
      const ty = trail[i].y - camY;
      ctx.beginPath();
      ctx.arc(tx, ty, trailR, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Glow — brighter when fast
  ctx.save();
  ctx.globalAlpha = fast ? 0.5 : 0.3;
  const glowR = fast ? r*2.5 : r*2;
  ctx.beginPath(); ctx.arc(px, py, glowR, 0, Math.PI*2);
  const gg = ctx.createRadialGradient(px,py,0,px,py,glowR);
  gg.addColorStop(0, cfg.color); gg.addColorStop(1, 'transparent');
  ctx.fillStyle = gg; ctx.fill();
  ctx.restore();

  // Drop shadow under ball
  ctx.save();
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2);
  ctx.shadowColor = cfg.color + '80'; // 50% opacity player color
  ctx.shadowBlur = 15;
  ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 3;
  ctx.fillStyle = cfg.color; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.restore();

  // Token circle — face or initials
  const faceImg = imgs['p'+idx];
  const hasFace = CFG.facesInBalls && faceImg && faceImg.naturalWidth > 0;

  ctx.save();
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2);
  ctx.fillStyle = cfg.color; ctx.fill();

  if(hasFace){
    // Draw headshot clipped to circle, cropping top 60% (face area)
    const clipR = r - 2;
    ctx.save();
    ctx.beginPath(); ctx.arc(px, py, clipR, 0, Math.PI*2); ctx.clip();
    const iw = faceImg.naturalWidth, ih = faceImg.naturalHeight;
    const cropH = ih * 0.6;
    const cropW = Math.min(iw, cropH);
    const sx = (iw - cropW) / 2, sy = 0;
    const dSize = clipR * 2;
    ctx.drawImage(faceImg, sx, sy, cropW, cropH, px - clipR, py - clipR, dSize, dSize);
    ctx.restore();
  } else {
    // Bold 2-char initials in white
    const initials = cfg.name.split(/\s+/).map(w=>w[0]).slice(0,2).join('');
    ctx.fillStyle = '#fff';
    ctx.font = '900 20px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(initials, px, py);
  }
  ctx.restore();

  // 3px white outer ring for contrast
  ctx.save();
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();
}

function drawParticlesOnScreen(){
  ctx.save();
  particles.forEach(p=>{
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath(); ctx.arc(p.x, p.y-camY, p.size, 0, Math.PI*2);
    ctx.fillStyle = p.color; ctx.fill();
  });
  ctx.restore();
}

function drawFinishFlashes(now){
  if(finishFlashes.length === 0) return;
  ctx.save();
  for(let i = finishFlashes.length - 1; i >= 0; i--){
    const f = finishFlashes[i];
    const elapsed = (now - f.t) / 1000;
    if(elapsed > 1.5){ finishFlashes.splice(i, 1); continue; }
    const alpha = 1 - (elapsed / 1.5);
    const scale = 1 + elapsed * 0.3; // slight grow
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `900 ${Math.round(52 * scale)}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = f.color;
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 12;
    ctx.fillText(f.text, W/2, H * 0.35);
    ctx.restore();
  }
  ctx.restore();
}

function drawResultsScreen(){
  if(phase !== 'results') return;
  const elapsed = (performance.now() - (autoRestartT - 12000)) / 1000;
  const fadeT = Math.min(1, elapsed / 0.6);

  ctx.save();

  // Dark overlay
  ctx.fillStyle = `rgba(0,0,0,${0.88 * fadeT})`;
  ctx.fillRect(0, 0, W, H);

  if(fadeT < 0.1){ ctx.restore(); return; }
  ctx.globalAlpha = Math.min(1, (fadeT - 0.1) / 0.9);

  // Title
  ctx.font = '900 42px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
  ctx.fillText('FINAL RESULTS', W/2, 60);
  ctx.shadowBlur = 0;

  // Finishers list
  const rowH = 52;
  const startY = 140;
  const N = CFG.playerCount;

  for(let i = 0; i < finishOrder.length; i++){
    const f = finishOrder[i];
    const rowY = startY + i * rowH;
    const timeSec = ((f.time - firstFinishT) / 1000);
    const timeStr = i === 0 ? '0.000s' : '+' + timeSec.toFixed(3) + 's';
    const ordinal = i===0?'1ST':i===1?'2ND':i===2?'3RD':(i+1)+'TH';

    // Position badge
    ctx.font = '900 22px system-ui';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = i === 0 ? '#ffd700' : i === 1 ? '#c0c0c0' : i === 2 ? '#cd7f32' : '#8899aa';
    ctx.fillText(ordinal, 40, rowY + rowH/2);

    // Headshot thumbnail
    const thumbR = 18;
    const thumbCX = 120, thumbCY = rowY + rowH/2;
    const thumbImg = imgs['p' + f.idx];
    ctx.save();
    ctx.beginPath(); ctx.arc(thumbCX, thumbCY, thumbR, 0, Math.PI*2); ctx.clip();
    if(thumbImg && thumbImg.naturalWidth > 0){
      const sc = Math.max(thumbR*2/thumbImg.naturalWidth, thumbR*2/thumbImg.naturalHeight);
      const dw = thumbImg.naturalWidth * sc, dh = thumbImg.naturalHeight * sc;
      ctx.drawImage(thumbImg, thumbCX - dw/2, thumbCY - dh/2 - dh*0.1, dw, dh);
    } else {
      ctx.fillStyle = f.color;
      ctx.fillRect(thumbCX-thumbR, thumbCY-thumbR, thumbR*2, thumbR*2);
      ctx.fillStyle = '#fff'; ctx.font = '700 14px system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(f.name.split(/\s+/).map(w=>w[0]).slice(0,2).join(''), thumbCX, thumbCY);
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(thumbCX, thumbCY, thumbR, 0, Math.PI*2);
    ctx.strokeStyle = f.color; ctx.lineWidth = 2.5; ctx.stroke();

    // Name
    ctx.font = '700 20px system-ui';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(f.name, 148, rowY + rowH/2);

    // Time
    ctx.font = '600 17px system-ui';
    ctx.textAlign = 'right';
    ctx.fillStyle = i === 0 ? '#ffd700' : 'rgba(200,220,255,.7)';
    ctx.fillText(timeStr, W - 40, rowY + rowH/2);
  }

  // DNF players
  const finishedIdxs = new Set(finishOrder.map(f=>f.idx));
  let dnfY = startY + finishOrder.length * rowH;
  for(let i = 0; i < N; i++){
    if(!finishedIdxs.has(i)){
      const rowY = dnfY;
      dnfY += rowH;
      ctx.font = '700 20px system-ui';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#556';
      ctx.fillText('DNF', 40, rowY + rowH/2);

      // Thumbnail
      const thumbR = 18;
      const thumbCX = 120, thumbCY = rowY + rowH/2;
      const thumbImg = imgs['p' + i];
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.arc(thumbCX, thumbCY, thumbR, 0, Math.PI*2); ctx.clip();
      if(thumbImg && thumbImg.naturalWidth > 0){
        const sc = Math.max(thumbR*2/thumbImg.naturalWidth, thumbR*2/thumbImg.naturalHeight);
        const dw = thumbImg.naturalWidth * sc, dh = thumbImg.naturalHeight * sc;
        ctx.drawImage(thumbImg, thumbCX - dw/2, thumbCY - dh/2 - dh*0.1, dw, dh);
      } else {
        ctx.fillStyle = CFG.players[i].color;
        ctx.fillRect(thumbCX-thumbR, thumbCY-thumbR, thumbR*2, thumbR*2);
        ctx.fillStyle = '#fff'; ctx.font = '700 14px system-ui';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(CFG.players[i].name.split(/\s+/).map(w=>w[0]).slice(0,2).join(''), thumbCX, thumbCY);
      }
      ctx.restore();
      ctx.beginPath(); ctx.arc(thumbCX, thumbCY, thumbR, 0, Math.PI*2);
      ctx.strokeStyle = '#445'; ctx.lineWidth = 2; ctx.stroke();

      // Name
      ctx.font = '700 20px system-ui';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#556';
      ctx.fillText(CFG.players[i].name, 148, rowY + rowH/2);

      ctx.font = '600 17px system-ui';
      ctx.textAlign = 'right';
      ctx.fillStyle = '#445';
      ctx.fillText('DNF', W - 40, rowY + rowH/2);
    }
  }

  // Auto-restart countdown
  const remaining = Math.max(0, (autoRestartT - performance.now()) / 1000);
  ctx.font = '600 18px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(200,220,255,.5)';
  ctx.fillText(`Restarting in ${Math.ceil(remaining)}...`, W/2, H - 40);

  ctx.restore();
}

function drawHUD(){
  const N = tokenBodies.length;
  const positions = tokenBodies.map(b=>b.position.y);
  const pcts = positions.map(y => Math.min(100, Math.max(0, (y/FINISH_Y)*100)));

  // Build sorted ranking
  const ranking = [];
  for(let i=0; i<N; i++) ranking.push(i);
  ranking.sort((a,b)=>positions[b]-positions[a]); // leader first

  ctx.save();

  if(N <= 2){
    // ── 2-player bar HUD ──
    const barH = 36, thumbR = 22, barY = 6;
    const barW = W/2 - 4;
    const leader = ranking[0];

    for(let i=0; i<N; i++){
      const cfg = CFG.players[i];
      const barX = i === 0 ? 2 : W/2 + 2;
      const pct = pcts[i];

      ctx.fillStyle = 'rgba(10,10,40,0.85)';
      roundRect(barX, barY, barW, barH, 6); ctx.fill();

      ctx.save();
      roundRect(barX, barY, barW, barH, 6); ctx.clip();
      ctx.fillStyle = cfg.color; ctx.globalAlpha = 0.5;
      ctx.fillRect(barX, barY, barW*(pct/100), barH);
      ctx.globalAlpha = 1; ctx.restore();

      const thumbCX = i === 0 ? barX + 8 + thumbR : barX + barW - 8 - thumbR;
      const thumbCY = barY + barH/2;
      const thumbImg = imgs['p'+i];
      ctx.save();
      ctx.beginPath(); ctx.arc(thumbCX, thumbCY, thumbR, 0, Math.PI*2); ctx.clip();
      if(thumbImg && thumbImg.naturalWidth > 0){
        const scale = Math.max(thumbR*2/thumbImg.naturalWidth, thumbR*2/thumbImg.naturalHeight);
        const dw = thumbImg.naturalWidth * scale, dh = thumbImg.naturalHeight * scale;
        ctx.drawImage(thumbImg, thumbCX - dw/2, thumbCY - dh/2 - dh*0.15, dw, dh);
      } else {
        ctx.fillStyle = cfg.color;
        ctx.fillRect(thumbCX-thumbR, thumbCY-thumbR, thumbR*2, thumbR*2);
        ctx.fillStyle = '#fff'; ctx.font = '700 18px system-ui';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(cfg.name.split(/\s+/).map(w=>w[0]).slice(0,2).join(''), thumbCX, thumbCY);
      }
      ctx.restore();
      ctx.beginPath(); ctx.arc(thumbCX, thumbCY, thumbR, 0, Math.PI*2);
      ctx.strokeStyle = cfg.color; ctx.lineWidth = 2; ctx.stroke();

      ctx.fillStyle = '#fff'; ctx.font = '700 16px system-ui'; ctx.textBaseline = 'middle';
      const nameStr = `${cfg.name} ${Math.round(pct)}%`;
      if(i === 0){ ctx.textAlign = 'left'; ctx.fillText(nameStr, thumbCX + thumbR + 8, thumbCY); }
      else { ctx.textAlign = 'right'; ctx.fillText(nameStr, thumbCX - thumbR - 8, thumbCY); }

      if(i===leader && phase==='race'){
        ctx.fillStyle = '#ffd700'; ctx.font = '700 12px system-ui';
        if(i === 0){ ctx.textAlign = 'right'; ctx.fillText('▲ LEAD', barX + barW - 8, thumbCY); }
        else { ctx.textAlign = 'left'; ctx.fillText('▲ LEAD', barX + 8, thumbCY); }
      }
    }

    if(phase==='race'){
      const gap = Math.abs(pcts[0] - (pcts[1]||0));
      ctx.textAlign = 'center'; ctx.font = '700 13px system-ui'; ctx.textBaseline = 'middle';
      const gapY = barY + barH + 16;
      if(gap < 3){ ctx.fillStyle = '#ff4444'; ctx.fillText('NECK AND NECK', W/2, gapY); }
      else if(gap <= 15){ ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillText(`GAP: ${Math.round(gap)}%`, W/2, gapY); }
      else { ctx.fillStyle = '#ff8c00'; ctx.fillText('RUNAWAY!', W/2, gapY); }
    }
  } else if(N <= 4){
    // ── 3-4 player compact bar HUD ──
    const barH = 28, thumbR = 16, barY = 6;
    const colW = Math.floor(W / N) - 4;
    const leader = ranking[0];

    for(let i=0; i<N; i++){
      const cfg = CFG.players[i];
      const barX = 2 + i * (colW + 4);
      const pct = pcts[i];

      ctx.fillStyle = 'rgba(10,10,40,0.85)';
      roundRect(barX, barY, colW, barH, 5); ctx.fill();

      ctx.save();
      roundRect(barX, barY, colW, barH, 5); ctx.clip();
      ctx.fillStyle = cfg.color; ctx.globalAlpha = 0.5;
      ctx.fillRect(barX, barY, colW*(pct/100), barH);
      ctx.globalAlpha = 1; ctx.restore();

      const thumbCX = barX + 6 + thumbR;
      const thumbCY = barY + barH/2;
      const thumbImg = imgs['p'+i];
      ctx.save();
      ctx.beginPath(); ctx.arc(thumbCX, thumbCY, thumbR, 0, Math.PI*2); ctx.clip();
      if(thumbImg && thumbImg.naturalWidth > 0){
        const scale = Math.max(thumbR*2/thumbImg.naturalWidth, thumbR*2/thumbImg.naturalHeight);
        const dw = thumbImg.naturalWidth * scale, dh = thumbImg.naturalHeight * scale;
        ctx.drawImage(thumbImg, thumbCX - dw/2, thumbCY - dh/2 - dh*0.15, dw, dh);
      } else {
        ctx.fillStyle = cfg.color;
        ctx.fillRect(thumbCX-thumbR, thumbCY-thumbR, thumbR*2, thumbR*2);
        ctx.fillStyle = '#fff'; ctx.font = '700 11px system-ui';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(cfg.name.split(/\s+/).map(w=>w[0]).slice(0,2).join(''), thumbCX, thumbCY);
      }
      ctx.restore();
      ctx.beginPath(); ctx.arc(thumbCX, thumbCY, thumbR, 0, Math.PI*2);
      ctx.strokeStyle = cfg.color; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.fillStyle = '#fff'; ctx.font = '600 11px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(`${Math.round(pct)}%`, thumbCX + thumbR + 4, thumbCY);

      if(i===leader && phase==='race'){
        ctx.fillStyle = '#ffd700'; ctx.font = '700 10px system-ui';
        ctx.textAlign = 'right';
        ctx.fillText('LEAD', barX + colW - 4, thumbCY);
      }
    }
  } else {
    // ── Leaderboard HUD for 5+ players ──
    const showCount = Math.min(4, N);
    const rowH = 28, startY = 6, lbW = 200;
    const lbX = W - lbW - 6;

    // Background
    ctx.fillStyle = 'rgba(10,10,40,0.85)';
    roundRect(lbX, startY, lbW, rowH * showCount + 4, 6); ctx.fill();

    for(let r=0; r<showCount; r++){
      const idx = ranking[r];
      const cfg = CFG.players[idx];
      const pct = pcts[idx];
      const rowY = startY + 2 + r * rowH;

      // Color bar behind row
      ctx.save();
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = cfg.color;
      ctx.fillRect(lbX + 2, rowY, (lbW - 4) * (pct/100), rowH - 2);
      ctx.globalAlpha = 1;
      ctx.restore();

      // Rank number
      ctx.fillStyle = r === 0 ? '#ffd700' : '#9bc';
      ctx.font = '700 13px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(`${r+1}.`, lbX + 6, rowY + rowH/2);

      // Headshot thumbnail (14px radius) or initials fallback
      const lbThumbR = 14;
      const lbThumbCX = lbX + 28, lbThumbCY = rowY + rowH/2;
      const lbImg = imgs['p'+idx];
      ctx.save();
      ctx.beginPath(); ctx.arc(lbThumbCX, lbThumbCY, lbThumbR, 0, Math.PI*2); ctx.clip();
      if(lbImg && lbImg.naturalWidth > 0){
        const sc = Math.max(lbThumbR*2/lbImg.naturalWidth, lbThumbR*2/lbImg.naturalHeight);
        const dw2 = lbImg.naturalWidth * sc, dh2 = lbImg.naturalHeight * sc;
        ctx.drawImage(lbImg, lbThumbCX - dw2/2, lbThumbCY - dh2/2 - dh2*0.1, dw2, dh2);
      } else {
        ctx.fillStyle = cfg.color;
        ctx.fillRect(lbThumbCX-lbThumbR, lbThumbCY-lbThumbR, lbThumbR*2, lbThumbR*2);
        ctx.fillStyle = '#fff'; ctx.font = '700 11px system-ui';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(cfg.name.split(/\s+/).map(w=>w[0]).slice(0,2).join(''), lbThumbCX, lbThumbCY);
      }
      ctx.restore();
      ctx.beginPath(); ctx.arc(lbThumbCX, lbThumbCY, lbThumbR, 0, Math.PI*2);
      ctx.strokeStyle = cfg.color; ctx.lineWidth = 1.5; ctx.stroke();

      // Name (truncated) + pct
      ctx.fillStyle = '#fff'; ctx.font = '600 12px system-ui'; ctx.textAlign = 'left';
      const shortName = cfg.name.length > 12 ? cfg.name.slice(0,11)+'…' : cfg.name;
      ctx.fillText(shortName, lbX + 46, rowY + rowH/2);

      ctx.textAlign = 'right';
      ctx.fillText(`${Math.round(pct)}%`, lbX + lbW - 8, rowY + rowH/2);
    }

    // Show total count if truncated
    if(showCount < N){
      ctx.fillStyle = 'rgba(150,170,200,.5)'; ctx.font = '600 11px system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(`+${N - showCount} more`, lbX + lbW/2, startY + rowH * showCount + 6);
    }
  }

  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ════════════════════════════ FPS COUNTER ════════════════════════════
let _fpsFrames = 0, _fpsLast = 0, _fpsDisplay = 0;

function drawFPS(){
  ctx.save();
  ctx.font = '600 12px system-ui';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';

// ════════════════════════════ GAME LOOP ════════════════════════════
let lastT = 0;

function loop(now){
  // FPS counter + performance auto-adjust
  _fpsFrames++;
  if(now - _fpsLast >= 1000){
    _fpsDisplay = _fpsFrames;
    _fpsFrames = 0;
    _fpsLast = now;
    // If FPS drops below 45, cull 50% of particles
    if(_fpsDisplay > 0 && _fpsDisplay < 45 && particles.length > 4){
      particles.splice(0, Math.floor(particles.length / 2));
    }
  }

  const dt = Math.min((now-lastT)/1000, 0.05);
  lastT = now;

  // Physics — fixed timestep 16.67ms (run during race AND finishing)
  if(phase==='race' || phase==='finishing'){
    // Slow-mo effect — decay back to 1x
    if(slowMoActive && now >= slowMoEnd){
      slowMoActive = false; slowMoScale = 1;
    }
    const fixedDt = 1000/60; // 16.67ms
    const timeScale = slowMoActive ? 0.5 : 1;
    Engine.update(engine, fixedDt*timeScale);

    // Rotate paddles every frame
    paddleBodies.forEach(b => Body.setAngle(b, b.angle + b._rotSpeed));
    // Oscillating gates every frame
    oscGateBodies.forEach(b => {
      const t = performance.now()/1000;
      const s = Math.sin((t / b._oscPeriod + b._oscPhase) * Math.PI * 2);
      const nx = b._oscXCenter + s * b._oscXRange;
      Body.setPosition(b, {x:nx, y:b._oscY});
    });

    // Trapdoor timers — hold then open
    const tdDt = 1/60;
    trapdoorBodies.forEach(b => {
      if(b._tdPartner && b._tdPartner._tdTimer > b._tdTimer) return; // sync: only process once per pair
      if(!b._tdOpen){
        // Check if any ball is resting on trapdoor
        let ballOnTop = false;
        for(const tb of tokenBodies){
          const dx = Math.abs(tb.position.x - b.position.x);
          const dy = tb.position.y - b.position.y;
          if(dx < b._w/2 + 30 && dy < 0 && dy > -50) ballOnTop = true;
        }
        if(ballOnTop) b._tdTimer += tdDt;
        else b._tdTimer = Math.max(0, b._tdTimer - tdDt * 2);
        if(b._tdTimer >= b._tdHoldTime){
          b._tdOpen = true; b._tdTimer = 0;
          b.collisionFilter = {mask:0};
          if(b._tdPartner){ b._tdPartner._tdOpen = true; b._tdPartner._tdTimer = 0; b._tdPartner.collisionFilter = {mask:0}; }
        }
      } else {
        b._tdTimer += tdDt;
        if(b._tdTimer >= b._tdOpenDur){
          b._tdOpen = false; b._tdTimer = 0;
          b.collisionFilter = {mask:0xFFFFFFFF};
          if(b._tdPartner){ b._tdPartner._tdOpen = false; b._tdPartner._tdTimer = 0; b._tdPartner.collisionFilter = {mask:0xFFFFFFFF}; }
        }
      }
    });

    // JawGate animation — close/open on timer, disable collision when open
    jawGateBodies.forEach(jaw => {
      const t = performance.now()/1000;
      const cycle = (t % jaw._jawPeriod) / jaw._jawPeriod; // 0→1
      // 0-0.4: closed (blocking), 0.4-0.6: opening, 0.6-1.0: open
      let angle;
      let isOpen = false;
      if(cycle < 0.4){
        angle = jaw._jawSide * 0.5; // closed angle
      } else if(cycle < 0.6){
        const openT = (cycle - 0.4) / 0.2;
        angle = jaw._jawSide * 0.5 * (1 - openT);
        isOpen = true; // opening phase — disable collision
      } else {
        angle = 0; // fully open
        isOpen = true;
      }
      // Toggle collision: mask=0 when open so balls pass through cleanly
      jaw.collisionFilter.mask = isOpen ? 0 : 0xFFFFFFFF;
      Body.setAngle(jaw, angle);
      // Reposition to pivot from base edge
      const pivotX = jaw._jawBaseX;
      const pivotY = jaw._jawBaseY;
      const halfLen = jaw._jawLen / 2;
      Body.setPosition(jaw, {
        x: pivotX - jaw._jawSide * Math.cos(angle) * halfLen,
        y: pivotY + Math.sin(Math.abs(angle)) * halfLen
      });
    });

    // TiltPlatform animation — flat → tilting → held → resetting cycle
    const tpDt = 1/60;
    tiltPlatformBodies.forEach(tp => {
      tp._tiltTimer += tpDt;
      const tpPhase = tp._tiltPhase;
      if(tpPhase === 'flat'){
        if(tp._tiltTimer >= tp._tiltFlatDur){
          tp._tiltPhase = 'tilting'; tp._tiltTimer = 0;
        }
      } else if(tpPhase === 'tilting'){
        const progress = Math.min(1, tp._tiltTimer / tp._tiltDur);
        const eased = progress * progress; // ease-in
        Body.setAngle(tp, tp._tiltDir * tp._tiltMaxAngle * eased);
        if(progress >= 1){
          tp._tiltPhase = 'held'; tp._tiltTimer = 0;
        }
      } else if(tpPhase === 'held'){
        if(tp._tiltTimer >= tp._tiltHoldDur){
          tp._tiltPhase = 'resetting'; tp._tiltTimer = 0;
        }
      } else if(tpPhase === 'resetting'){
        const progress = Math.min(1, tp._tiltTimer / tp._tiltResetDur);
        const eased = 1 - (1 - progress) * (1 - progress); // ease-out
        Body.setAngle(tp, tp._tiltDir * tp._tiltMaxAngle * (1 - eased));
        if(progress >= 1){
          tp._tiltPhase = 'flat'; tp._tiltTimer = 0;
          Body.setAngle(tp, 0);
        }
      }
    });

    // BaitFunnel release — if ball in center channel is slow, open inner walls
    baitFunnelBodies.forEach(bf => {
      const innerWalls = bf._bfInnerWalls;
      if(!innerWalls) return;
      const [leftInner, rightInner] = innerWalls;
      const cx = leftInner._bfCenterX;
      const cy = leftInner._bfBaseY;
      const halfGap = Math.abs(rightInner._bfBaseX - leftInner._bfBaseX) / 2;
      let needRelease = false;
      for(const tb of tokenBodies){
        const dx = Math.abs(tb.position.x - cx);
        const dy = Math.abs(tb.position.y - cy);
        if(dx < halfGap + 20 && dy < 50){
          const spd = Math.sqrt(tb.velocity.x*tb.velocity.x + tb.velocity.y*tb.velocity.y);
          if(spd < 2) needRelease = true;
        }
      }
      if(needRelease && !leftInner._bfReleasing){
        leftInner._bfReleasing = true;
        rightInner._bfReleasing = true;
        leftInner._bfReleaseT = performance.now();
        rightInner._bfReleaseT = performance.now();
      }
      if(leftInner._bfReleasing){
        const elapsed = (performance.now() - leftInner._bfReleaseT) / 1000;
        if(elapsed < 2){
          // Angle walls outward 15° to create escape path
          const angle = Math.min(0.262, elapsed * 0.2);
          Body.setAngle(leftInner, -angle);
          Body.setAngle(rightInner, angle);
        } else {
          // Reset
          Body.setAngle(leftInner, 0);
          Body.setAngle(rightInner, 0);
          Body.setPosition(leftInner, {x: leftInner._bfBaseX, y: leftInner._bfBaseY});
          Body.setPosition(rightInner, {x: rightInner._bfBaseX, y: rightInner._bfBaseY});
          leftInner._bfReleasing = false;
          rightInner._bfReleasing = false;
        }
      }
    });

    const N = tokenBodies.length;

    // Danger zone — boost bumper impacts for balls past DANGER_ZONE_Y
    for(let i=0; i<N; i++){
      const tb = tokenBodies[i];
      if(tb.position.y > DANGER_ZONE_Y){
        // Check if just bounced off a bumper (high speed change indicates collision)
        const spd = Math.sqrt(tb.velocity.x*tb.velocity.x + tb.velocity.y*tb.velocity.y);
        if(spd > 3){
          // Amplify velocity slightly for more chaotic bounces
          Body.setVelocity(tb, {x:tb.velocity.x*1.04, y:tb.velocity.y*1.04});
        }
      }
    }

    // Record trail positions
    for(let i=0; i<N; i++){
      const p = tokenBodies[i].position;
      trailHistory[i].push({x:p.x, y:p.y});
      if(trailHistory[i].length > 8) trailHistory[i].shift();
    }

    // Max speed cap — keep action readable
    const MAX_SPEED = 7;
    for(let i=0; i<N; i++){
      const tb = tokenBodies[i];
      const spd = Math.sqrt(tb.velocity.x*tb.velocity.x + tb.velocity.y*tb.velocity.y);
      if(spd > MAX_SPEED){
        const scale = MAX_SPEED / spd;
        Body.setVelocity(tb, {x:tb.velocity.x*scale, y:tb.velocity.y*scale});
      }
    }

    // Conveyor strip physics removed — conveyors fully disabled

    // Win% bias force
    for(let i=0; i<N; i++){
      const tb = tokenBodies[i];
      const bias = (CFG.players[i].winBias||50)/100;
      const bForce = (bias - 0.5) * 0.002;
      if(Math.abs(bForce) > 0.00005){
        Body.applyForce(tb, tb.position, {x:0, y:bForce});
      }
    }

    // Danger proximity warnings — check ball distance to moving obstacles
    const movingObs = [...paddleBodies, ...oscGateBodies];
    for(let i=0; i<N; i++){
      const tb = tokenBodies[i];
      for(const mob of movingObs){
        const dx = tb.position.x - mob.position.x;
        const dy = tb.position.y - mob.position.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 100){
          const hasRecent = dangerWarnings.some(w =>
            Math.abs(w.x - tb.position.x) < 40 &&
            Math.abs(w.y - tb.position.y) < 40 &&
            now - w.t < 400
          );
          if(!hasRecent){
            dangerWarnings.push({x:tb.position.x, y:tb.position.y, t:now});
          }
        }
      }
    }
    dangerWarnings = dangerWarnings.filter(w => now - w.t < 400);

    // Slow-mo tension — when any two balls are split across a moving obstacle
    if(!slowMoActive){
      outer: for(const mob of movingObs){
        const my = mob.position.y;
        let hasAbove = false, hasBelow = false;
        for(let i=0; i<N; i++){
          const py = tokenBodies[i].position.y;
          if(py < my && my - py < 300) hasAbove = true;
          if(py > my && py - my < 300) hasBelow = true;
        }
        if(hasAbove && hasBelow){
          slowMoActive = true;
          slowMoEnd = now + 1500;
          slowMoScale = 0.5;
          break outer;
        }
      }
    }

    // Check finishers — track ALL balls crossing finish
    for(let i=0; i<N; i++){
      if(tokenBodies[i].position.y >= FINISH_Y - 50 && !finishedSet.has(i)){
        finishedSet.add(i);
        const pos = finishOrder.length + 1;
        finishOrder.push({idx:i, name:CFG.players[i].name, color:CFG.players[i].color, time:performance.now()});
        // Position flash
        const ordinal = pos===1?'1ST!':pos===2?'2ND!':pos===3?'3RD!':pos+'TH!';
        finishFlashes.push({text:ordinal, color:CFG.players[i].color, t:performance.now()});
        if(pos === 1){
          // First finisher
          winner = i;
          winnerT = performance.now();
          firstFinishT = performance.now();
          phase = 'finishing';
        }
        if(finishedSet.size === N){
          // All finished
          phase = 'results';
          autoRestartT = now + 12000;
          if(rActive) setTimeout(()=>stopRec(), 2000);
        }
      }
    }
    // DNF cutoff — 25s after first finish
    if(phase === 'finishing' && firstFinishT > 0 && performance.now() - firstFinishT >= DNF_CUTOFF){
      phase = 'results';
      autoRestartT = now + 12000;
      if(rActive) setTimeout(()=>stopRec(), 2000);
    }

    // Lead change detection — only flash after 5+ seconds of held lead
    let curLeader = 0;
    for(let i=1; i<N; i++){
      if(tokenBodies[i].position.y > tokenBodies[curLeader].position.y) curLeader = i;
    }
    if(curLeader !== lastLeader){
      if(lastLeader >= 0 && leaderSinceT > 0 && (now - leaderSinceT) >= 5000){
        leadChangeT = performance.now();
      }
      leaderSinceT = now;
    }
    lastLeader = curLeader;

    // Checkpoint detection
    const cpThresholds = [50, 75, 90];
    for(let i=0; i<N; i++){
      const pct = Math.min(100, (tokenBodies[i].position.y / FINISH_Y) * 100);
      for(let c=0; c<3; c++){
        if(!checkpointsPassed[i][c] && pct >= cpThresholds[c]){
          checkpointsPassed[i][c] = true;
          checkpointFlash = {active:true, t:performance.now(), color:CFG.players[i].color, pct:cpThresholds[c]};
        }
      }
    }

    // Camera — follow the leader, not the trailer
    const sorted = tokenBodies
      .map((b,i) => ({b, i, y: b.position.y}))
      .filter(t => !finishedSet.has(t.i))
      .sort((a,z) => z.y - a.y); // highest Y = furthest down = leader
    let focusY;
    const n = CFG.playerCount;
    if(n <= 2) {
      // 70% leader, 30% trailer
      const leader = sorted[0]?.b.position.y ?? FINISH_Y/2;
      const trailer = sorted[sorted.length-1]?.b.position.y ?? leader;
      focusY = leader * 0.70 + trailer * 0.30;
    } else if(n <= 4) {
      // weighted center of top 2
      const top = sorted.slice(0,2);
      focusY = top.reduce((s,t)=>s+t.b.position.y,0)/top.length;
    } else {
      // weighted center of top 3
      const top = sorted.slice(0,3);
      focusY = top.reduce((s,t)=>s+t.b.position.y,0)/top.length;
    }
    // Keep leader in upper 35% of viewport + 180px lookahead
    const targetCamY = focusY - H * 0.35 + 180;
    // Asymmetric lerp: fast down, slow up
    if(targetCamY > camY) {
      camY += (targetCamY - camY) * 0.09;
    } else {
      camY += (targetCamY - camY) * 0.018;
    }
    camY = Math.max(0, camY);
  }

  if(phase==='results' && now >= autoRestartT){
    restartRace();
  }

  // Update particles
  updateParticles(dt);

  // Draw
  drawBackground();
  drawObstacles();
  for(let i=0; i<tokenBodies.length; i++) drawToken(tokenBodies[i], CFG.players[i], i);
  drawParticlesOnScreen();
  drawHUD();
  drawDangerWarnings(now);
  drawSlowMoIndicator();
  drawLeadChange();
  drawCheckpointFlash();
  drawVignette();
  drawFinishFlashes(now);
  if(phase==='results') drawResultsScreen();
  drawFPS();
  drawDebugOverlay();

  requestAnimationFrame(loop);
}

// ════════════════════════════ RECORDING ════════════════════════════
let mRec=null, rChunks=[], rActive=false;

function toggleRec(){ rActive ? stopRec() : startRec(); }

function startRec(){
  if(!canvas.captureStream){alert('Recording not supported.');return;}
  rChunks=[];
  const stream = canvas.captureStream(24);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9' : 'video/webm';
  mRec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:4000000});
  mRec.ondataavailable = e=>{ if(e.data&&e.data.size>0) rChunks.push(e.data); };
  mRec.start(1000);
  rActive = true;
  document.getElementById('recBtn').textContent = '⏹ STOP';
  document.getElementById('recBtn').style.color = '#ff5566';
  document.getElementById('recDot').style.display = 'block';
  restartRace();
}

function stopRec(){
  rActive = false;
  document.getElementById('recBtn').textContent = '⏺ REC';
  document.getElementById('recBtn').style.color = '';
  document.getElementById('recDot').style.display = 'none';
  if(mRec && mRec.state==='recording'){
    mRec.onstop = ()=>{
      if(rChunks.length===0) return;
      const blob = new Blob(rChunks, {type:mRec.mimeType||'video/webm'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'marble-race.webm';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},5000);
    };
    try{mRec.requestData();}catch(e){}
    mRec.stop();
  }
}

// ════════════════════════════ MODAL / CONFIG ════════════════════════════
let _allPlayers = null;
let _searchTarget = 1; // which player slot search fills

let _modalPlayerCount = 2; // tracks count while modal is open

function buildPlayerCards(){
  const container = document.getElementById('player-cards');
  container.innerHTML = '';
  for(let i=0; i<_modalPlayerCount; i++){
    const p = CFG.players[i] || {name:DEFAULT_NAMES[i]||'Player '+(i+1), img:DEFAULT_SLUGS[i]?'https://nba-battle.thejorgesierra.workers.dev/headshot/'+DEFAULT_SLUGS[i]+'.png':'', color:PALETTE[i]||'#888', winBias:50};
    container.innerHTML += `<div class="pcard" id="pc${i}">
<h3>Player ${i+1}</h3>
<div class="search-for" onclick="showSearch(${i})">🔍 Search NBA player...</div>
<div class="preview-row">
<img class="face-preview" id="prev${i}" crossorigin="anonymous" src="${p.img}">
<div style="flex:1">
<label>Name</label>
<input type="text" id="name${i}" value="${(p.name||'').replace(/"/g,'&quot;')}">
</div>
</div>
<label>Headshot URL</label>
<input type="url" id="url${i}" value="${(p.img||'').replace(/"/g,'&quot;')}" oninput="document.getElementById('prev${i}').src=this.value">
<label style="display:inline">or upload: </label>
<input type="file" id="file${i}" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="handleFile(${i},this)">
<button class="file-btn" onclick="document.getElementById('file${i}').click()">Choose Image</button>
<div style="display:flex;gap:16px;align-items:center;margin-top:6px">
<div><label>Color</label><br><input type="color" id="color${i}" value="${p.color}"></div>
<div style="flex:1"><label>Win % bias: <span id="winLbl${i}">${p.winBias||50}</span>%</label><input type="range" id="win${i}" min="1" max="99" value="${p.winBias||50}" oninput="document.getElementById('winLbl${i}').textContent=this.value"></div>
</div>
</div>`;
  }
}

function setPlayerCount(n){
  _modalPlayerCount = n;
  // Update active button
  document.querySelectorAll('.cnt-btn').forEach((btn,i)=>{
    btn.classList.toggle('active', [2,3,4,6,8][i]===n);
  });
  buildPlayerCards();
}

function openModal(){
  _modalPlayerCount = CFG.playerCount;
  // Update count buttons
  document.querySelectorAll('.cnt-btn').forEach((btn,i)=>{
    btn.classList.toggle('active', [2,3,4,6,8][i]===_modalPlayerCount);
  });
  buildPlayerCards();
  hideSearch();
  document.getElementById('facesToggle').checked = CFG.facesInBalls;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
}

function handleFile(idx, input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    document.getElementById('url'+idx).value = e.target.result;
    document.getElementById('prev'+idx).src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function applyConfig(){
  CFG.playerCount = _modalPlayerCount;
  CFG.facesInBalls = document.getElementById('facesToggle').checked;
  // Ensure players array is big enough
  while(CFG.players.length < CFG.playerCount){
    const i = CFG.players.length;
    CFG.players.push({name:DEFAULT_NAMES[i]||'Player '+(i+1), img:DEFAULT_IDS[i]?'https://nba-battle.thejorgesierra.workers.dev/nba-headshot/'+DEFAULT_IDS[i]:'', color:PALETTE[i]||'#888', winBias:50});
  }
  // Read values from modal inputs
  for(let i=0; i<CFG.playerCount; i++){
    CFG.players[i].name = (document.getElementById('name'+i)||{}).value || 'Player '+(i+1);
    CFG.players[i].img = (document.getElementById('url'+i)||{}).value || '';
    CFG.players[i].color = (document.getElementById('color'+i)||{}).value || PALETTE[i] || '#888';
    CFG.players[i].winBias = parseInt((document.getElementById('win'+i)||{}).value)||50;
  }

  // Show loading overlay
  const modal = document.getElementById('modal');
  const loadingDiv = document.createElement('div');
  loadingDiv.id = 'apply-loading';
  loadingDiv.style.cssText = 'position:absolute;inset:0;background:rgba(13,27,62,.95);display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:14px;z-index:10';
  loadingDiv.innerHTML = '<div style="color:#87CEEB;font:700 22px system-ui;margin-bottom:12px">Loading headshots...</div><div style="color:#6a8ab0;font:14px system-ui">Please wait</div>';
  modal.style.position = 'relative';
  modal.appendChild(loadingDiv);

  // Reload images for all players
  for(const k of Object.keys(imgs)) delete imgs[k];
  loadAllPlayerImgs();

  const applyStart = performance.now();
  function checkReady(){
    if(imgsLoaded >= CFG.players.length || performance.now() - applyStart > 3000){
      const el = document.getElementById('apply-loading');
      if(el) el.remove();
      closeModal();
      restartRace();
      return;
    }
    requestAnimationFrame(checkReady);
  }
  requestAnimationFrame(checkReady);
}

// Player search
async function loadPlayersDB(){
  if(_allPlayers) return _allPlayers;
  try{
    const resp = await fetch('https://jsierrahoopshype.github.io/nba-headshots/metadata/players.json');
    _allPlayers = await resp.json();
    return _allPlayers;
  }catch(e){
    console.warn('Failed to load players.json:', e);
    _allPlayers = [];
    return [];
  }
}

function showSearch(idx){
  _searchTarget = idx;
  // Highlight active search button
  document.querySelectorAll('.search-for').forEach(el=>el.classList.remove('active'));
  document.querySelector('#pc'+idx+' .search-for').classList.add('active');
  document.getElementById('search-panel').style.display = '';
  document.getElementById('search-panel-title').textContent = 'Search NBA Players → Player '+(idx+1);
  document.getElementById('search-box').value = '';
  document.getElementById('search-results').innerHTML = '<div style="color:#6a8ab0;font:12px system-ui;padding:8px">Loading players...</div>';
  document.getElementById('search-box').focus();
  loadPlayersDB().then(()=>filterPlayers(''));
}

function hideSearch(){
  document.getElementById('search-panel').style.display = 'none';
  document.querySelectorAll('.search-for').forEach(el=>el.classList.remove('active'));
}

function filterPlayers(query){
  if(!_allPlayers) return;
  const q = query.toLowerCase().trim();
  const results = q.length < 2
    ? _allPlayers.slice(0, 30)
    : _allPlayers.filter(p=>(p.name||'').toLowerCase().includes(q)).slice(0,30);

  const container = document.getElementById('search-results');
  if(results.length === 0){
    container.innerHTML = '<div style="color:#6a8ab0;font:12px system-ui;padding:8px">No players found</div>';
    return;
  }
  container.innerHTML = results.map(p=>{
    const slug = p.slug || p.id || '';
    const imgUrl = slug ? `https://nba-battle.thejorgesierra.workers.dev/headshot/${slug}.png` : '';
    return `<div class="sr-item" onclick="pickPlayer('${(p.name||'').replace(/'/g,"\\'")}','${imgUrl}')">
      <img src="${imgUrl}" crossorigin="anonymous" onerror="this.style.display='none'">
      <span>${p.name||'Unknown'}</span>
    </div>`;
  }).join('');
}

function pickPlayer(name, imgUrl){
  const idx = _searchTarget;
  document.getElementById('name'+idx).value = name;
  document.getElementById('url'+idx).value = imgUrl;
  const prevEl = document.getElementById('prev'+idx);
  prevEl.crossOrigin = 'anonymous';
  prevEl.src = imgUrl;
  hideSearch();
}

// ════════════════════════════ INIT ════════════════════════════
createPhysics();
setupCollisionEvents();

// Preload images before starting race — show loading screen
let _preloadDone = false;
const _preloadStart = performance.now();

function drawLoadingScreen(){
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#87CEEB';
  ctx.font = '700 28px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Loading...', W/2, H/2);
  ctx.font = '400 16px system-ui';
  ctx.fillStyle = 'rgba(200,220,255,.5)';
  ctx.fillText('Preparing headshots', W/2, H/2 + 40);
}

function preloadLoop(now){
  const elapsed = now - _preloadStart;
  const bothLoaded = imgsLoaded >= CFG.players.length;
  const timedOut = elapsed > 3000;
  if(bothLoaded || timedOut){
    _preloadDone = true;
    lastT = performance.now();
    requestAnimationFrame(loop);
    return;
  }
  drawLoadingScreen();
  requestAnimationFrame(preloadLoop);
}
requestAnimationFrame(preloadLoop);
</script>
