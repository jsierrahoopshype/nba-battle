<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Race</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
canvas{border-radius:6px;cursor:default;position:relative;z-index:1}
#ui{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:50}
#ui button{background:rgba(20,20,50,.85);color:#ccd;border:1px solid rgba(100,140,255,.25);border-radius:8px;padding:8px 18px;font:700 14px system-ui;cursor:pointer;backdrop-filter:blur(6px)}
#ui button:hover{background:rgba(40,40,80,.95);border-color:rgba(100,140,255,.5)}
#recDot{display:none;position:fixed;top:14px;right:14px;width:14px;height:14px;background:#f33;border-radius:50%;z-index:20;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#modal-overlay.open{display:flex}
#modal{background:#0d1b3e;border:1px solid rgba(100,160,255,.25);border-radius:14px;width:92%;max-width:480px;max-height:88vh;overflow-y:auto;padding:20px;color:#cce}
#modal h2{text-align:center;font:700 22px system-ui;color:#87CEEB;margin-bottom:14px}
.pcard{background:rgba(10,20,50,.8);border:1px solid rgba(80,130,255,.2);border-radius:10px;padding:14px;margin-bottom:14px}
.pcard h3{font:700 15px system-ui;color:#9bc;margin-bottom:10px}
.pcard label{display:block;font:600 12px system-ui;color:#7a9cc0;margin:8px 0 3px}
.pcard input[type=text],.pcard input[type=url]{width:100%;background:#081228;border:1px solid rgba(80,130,255,.2);border-radius:6px;padding:7px 10px;color:#dde;font:13px system-ui;outline:none}
.pcard input:focus{border-color:rgba(100,160,255,.5)}
.pcard input[type=color]{width:40px;height:28px;border:1px solid rgba(80,130,255,.3);border-radius:4px;background:none;cursor:pointer;vertical-align:middle}
.pcard input[type=range]{width:100%;accent-color:#87CEEB}
.pcard .preview-row{display:flex;align-items:center;gap:10px}
.pcard .face-preview{width:40px;height:40px;border-radius:50%;border:2px solid #445;object-fit:cover;background:#081228;flex-shrink:0}
.pcard .file-btn{background:#142044;border:1px solid rgba(100,140,255,.25);border-radius:6px;padding:5px 12px;color:#9bc;font:600 12px system-ui;cursor:pointer}
.pcard .file-btn:hover{background:#1a2a55}
#search-box{width:100%;background:#081228;border:1px solid rgba(80,130,255,.2);border-radius:6px;padding:7px 10px;color:#dde;font:13px system-ui;outline:none;margin-bottom:6px}
#search-box:focus{border-color:rgba(100,160,255,.5)}
#search-results{max-height:180px;overflow-y:auto;margin-bottom:12px}
.sr-item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;font:13px system-ui;color:#bcd}
.sr-item:hover{background:rgba(80,130,255,.15)}
.sr-item img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#081228}
#modal .btn-row{display:flex;gap:10px;justify-content:center;margin-top:14px}
#modal .btn-row button{padding:10px 28px;border-radius:8px;border:none;font:700 15px system-ui;cursor:pointer}
#modal .btn-apply{background:#2a6fff;color:#fff}
#modal .btn-apply:hover{background:#3a7fff}
#modal .btn-cancel{background:#1a2040;color:#8ab;border:1px solid rgba(80,130,255,.25)}
#modal .btn-cancel:hover{background:#222a50}
.search-for{display:inline-block;font:600 12px system-ui;color:#9bc;background:#142044;border:1px solid rgba(100,140,255,.25);border-radius:6px;padding:5px 12px;margin-bottom:8px;cursor:pointer}
.search-for:hover{background:#1a2a55;border-color:rgba(100,140,255,.5);color:#87CEEB}
.search-for.active{background:#2a6fff;color:#fff;border-color:#2a6fff}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<button onclick="restartRace()">⟳ RESTART</button>
<button onclick="openModal()">⚙ PLAYERS</button>
<button id="recBtn" onclick="toggleRec()">⏺ REC</button>
</div>
<div id="recDot"></div>
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
<div id="modal">
<h2>⚙ Configure Players</h2>
<div class="pcard" id="pc1">
<h3>Player 1</h3>
<div class="search-for" onclick="showSearch(1)">🔍 Search NBA player...</div>
<div class="preview-row">
<img class="face-preview" id="prev1" src="">
<div style="flex:1">
<label>Name</label>
<input type="text" id="name1">
</div>
</div>
<label>Headshot URL</label>
<input type="url" id="url1" oninput="document.getElementById('prev1').src=this.value">
<label style="display:inline">or upload: </label>
<input type="file" id="file1" accept="image/*" style="display:none" onchange="handleFile(1,this)">
<button class="file-btn" onclick="document.getElementById('file1').click()">Choose Image</button>
<div style="display:flex;gap:16px;align-items:center;margin-top:6px">
<div><label>Color</label><br><input type="color" id="color1"></div>
<div style="flex:1"><label>Win % bias: <span id="winLbl1">50</span>%</label><input type="range" id="win1" min="1" max="99" value="50" oninput="document.getElementById('winLbl1').textContent=this.value"></div>
</div>
</div>
<div class="pcard" id="pc2">
<h3>Player 2</h3>
<div class="search-for" onclick="showSearch(2)">🔍 Search NBA player...</div>
<div class="preview-row">
<img class="face-preview" id="prev2" src="">
<div style="flex:1">
<label>Name</label>
<input type="text" id="name2">
</div>
</div>
<label>Headshot URL</label>
<input type="url" id="url2" oninput="document.getElementById('prev2').src=this.value">
<label style="display:inline">or upload: </label>
<input type="file" id="file2" accept="image/*" style="display:none" onchange="handleFile(2,this)">
<button class="file-btn" onclick="document.getElementById('file2').click()">Choose Image</button>
<div style="display:flex;gap:16px;align-items:center;margin-top:6px">
<div><label>Color</label><br><input type="color" id="color2"></div>
<div style="flex:1"><label>Win % bias: <span id="winLbl2">50</span>%</label><input type="range" id="win2" min="1" max="99" value="50" oninput="document.getElementById('winLbl2').textContent=this.value"></div>
</div>
</div>
<div id="search-panel" style="display:none">
<h3 id="search-panel-title" style="font:700 14px system-ui;color:#87CEEB;margin-bottom:6px">Search NBA Players</h3>
<input type="text" id="search-box" placeholder="Type a player name..." oninput="filterPlayers(this.value)">
<div id="search-results"></div>
<button class="file-btn" style="margin-top:4px" onclick="hideSearch()">Cancel Search</button>
</div>
<div class="btn-row">
<button class="btn-cancel" onclick="closeModal()">Cancel</button>
<button class="btn-apply" onclick="applyConfig()">Apply &amp; Restart</button>
</div>
</div>
</div>
<script>
// ════════════════════════════ CONFIGURATION ════════════════════════════
const CFG = {
  p1: {
    name: 'LeBron James',
    img: 'https://cdn.nba.com/headshots/nba/latest/260x190/2544.png',
    color: '#552583',
    winBias: 50
  },
  p2: {
    name: 'Stephen Curry',
    img: 'https://cdn.nba.com/headshots/nba/latest/260x190/201939.png',
    color: '#1D428A',
    winBias: 50
  },
  gravity: 0.6,
  seed: 42
};

// ════════════════════════════ CANVAS SETUP ════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 540, H = 960;
canvas.width = W; canvas.height = H;

function resize(){
  const s = Math.min(window.innerWidth/W, (window.innerHeight-60)/H);
  canvas.style.width = s*W+'px'; canvas.style.height = s*H+'px';
}
resize(); window.addEventListener('resize', resize);

// ════════════════════════════ SEEDED RNG ════════════════════════════
let _seed = CFG.seed;
function rng(){ _seed=((_seed*1103515245+12345)&0x7fffffff); return _seed/0x7fffffff; }
function rngRange(a,b){ return a+rng()*(b-a); }

// ════════════════════════════ LEVEL DESIGN ════════════════════════════
const FINISH_Y = 9800;
const LEVEL_H = 10000;
const BALL_RADIUS = 28;

function buildObstacles(){
  const obs = [];
  const CX = W/2; // 270
  // Standard thick ramp params
  const F = 0.12, R = 0.15;

  // ══ SECTION 1 (y 200–900): Hook ══

  // Mirrored curved funnel (exit 120px) merging both balls
  obs.push({type:'slope', x:0, y:250, w:200, angle:0.65, friction:F, restitution:R});
  obs.push({type:'slope', x:W, y:250, w:200, angle:-0.65, friction:F, restitution:R});
  obs.push({type:'slope', x:0, y:420, w:180, angle:0.78, friction:F, restitution:R});
  obs.push({type:'slope', x:W, y:420, w:180, angle:-0.78, friction:F, restitution:R});

  // Shared shallow bowl below (width 300px)
  obs.push({type:'slope', x:CX-150, y:620, w:130, angle:0.65, friction:F, restitution:R});
  obs.push({type:'slope', x:CX+150, y:620, w:130, angle:-0.65, friction:F, restitution:R});
  obs.push({type:'floor', x:CX, y:700, w:100, h:20});

  // One peg in center below bowl
  obs.push({type:'peg', x:CX, y:830, r:12, restitution:0.5});

  // ══ SECTION 2 (y 1000–1800): S-curve rolls ══

  // Left ramp angled right (leads ball right)
  obs.push({type:'slope', x:0, y:1050, w:220, angle:0.70, friction:F, restitution:R});

  // Right ramp angled left (leads ball left)
  obs.push({type:'slope', x:W, y:1300, w:220, angle:-0.70, friction:F, restitution:R});

  // Bowl at bottom catching both
  obs.push({type:'slope', x:CX-140, y:1530, w:120, angle:0.65, friction:F, restitution:R});
  obs.push({type:'slope', x:CX+140, y:1530, w:120, angle:-0.65, friction:F, restitution:R});
  obs.push({type:'floor', x:CX, y:1610, w:120, h:20});

  // 2 pegs in bowl exit
  obs.push({type:'peg', x:CX-50, y:1720, r:12, restitution:0.5});
  obs.push({type:'peg', x:CX+50, y:1720, r:12, restitution:0.5});

  // ══ SECTION 3 (y 1900–2700): First recompression ══

  // Wide funnel (exit 90px) merging both lanes
  obs.push({type:'slope', x:0, y:1950, w:240, angle:0.78, friction:F, restitution:R});
  obs.push({type:'slope', x:W, y:1950, w:240, angle:-0.78, friction:F, restitution:R});

  // Bowl below funnel
  obs.push({type:'slope', x:CX-130, y:2200, w:110, angle:0.65, friction:F, restitution:R});
  obs.push({type:'slope', x:CX+130, y:2200, w:110, angle:-0.65, friction:F, restitution:R});
  obs.push({type:'floor', x:CX, y:2280, w:100, h:20});

  // 3 pegs in triangle below bowl
  obs.push({type:'peg', x:CX, y:2430, r:12, restitution:0.5});
  obs.push({type:'peg', x:CX-70, y:2580, r:12, restitution:0.5});
  obs.push({type:'peg', x:CX+70, y:2580, r:12, restitution:0.5});

  // ══ SECTION 4 (y 2800–3800): First moving obstacle ══

  // Wide landing ledge (bowl shape)
  obs.push({type:'slope', x:0, y:2850, w:200, angle:0.65, friction:F, restitution:R});
  obs.push({type:'slope', x:W, y:2850, w:200, angle:-0.65, friction:F, restitution:R});
  obs.push({type:'floor', x:CX, y:2950, w:160, h:20});

  // ONE slow sweeper arm (length 160px, speed 0.012 rad/frame)
  obs.push({type:'paddle', x:CX, y:3150, w:160, speed:0.012});

  // Two exit ramps below sweeper (each 100px wide, forming two channels)
  obs.push({type:'slope', x:CX-120, y:3400, w:100, angle:0.65, friction:F, restitution:R});
  obs.push({type:'slope', x:CX+120, y:3400, w:100, angle:-0.65, friction:F, restitution:R});
  // Exit pegs
  obs.push({type:'peg', x:CX-60, y:3600, r:12, restitution:0.5});
  obs.push({type:'peg', x:CX+60, y:3600, r:12, restitution:0.5});

  // Transition ramp
  obs.push({type:'slope', x:0, y:3700, w:160, angle:0.70, friction:F, restitution:R});
  obs.push({type:'slope', x:W, y:3700, w:160, angle:-0.70, friction:F, restitution:R});

  // ══ SECTION 5 (y 3900–4800): Seesaw rivalry ══

  // Landing ramps
  obs.push({type:'slope', x:0, y:3950, w:180, angle:0.70, friction:F, restitution:R});
  obs.push({type:'slope', x:W, y:3950, w:180, angle:-0.70, friction:F, restitution:R});

  // Wide seesaw (240px beam)
  obs.push({type:'seesaw', x:CX, y:4200, w:240});

  // Two exit funnels below seesaw
  obs.push({type:'slope', x:0, y:4400, w:160, angle:0.78, friction:F, restitution:R});
  obs.push({type:'slope', x:W, y:4400, w:160, angle:-0.78, friction:F, restitution:R});
  obs.push({type:'slope', x:0, y:4600, w:200, angle:0.70, friction:F, restitution:R});
  obs.push({type:'slope', x:W, y:4600, w:200, angle:-0.70, friction:F, restitution:R});

  // Peg below exit
  obs.push({type:'peg', x:CX, y:4750, r:12, restitution:0.5});

  // ══ SECTION 6 (y 4900–5900): Rolling machine ══

  // S-curve of 3 large bowls alternating left/right

  // Bowl 1 — left-leaning
  obs.push({type:'slope', x:0, y:4950, w:250, angle:0.65, friction:F, restitution:R});
  obs.push({type:'slope', x:CX+60, y:5050, w:120, angle:-0.65, friction:F, restitution:R});
  obs.push({type:'floor', x:CX-30, y:5100, w:100, h:20});

  // Bowl 2 — right-leaning
  obs.push({type:'slope', x:W, y:5250, w:250, angle:-0.65, friction:F, restitution:R});
  obs.push({type:'slope', x:CX-60, y:5350, w:120, angle:0.65, friction:F, restitution:R});
  obs.push({type:'floor', x:CX+30, y:5400, w:100, h:20});

  // Bowl 3 — centered
  obs.push({type:'slope', x:0, y:5550, w:220, angle:0.65, friction:F, restitution:R});
  obs.push({type:'slope', x:W, y:5550, w:220, angle:-0.65, friction:F, restitution:R});
  obs.push({type:'floor', x:CX, y:5650, w:100, h:20});

  // Transition pegs
  obs.push({type:'peg', x:CX-50, y:5800, r:12, restitution:0.5});
  obs.push({type:'peg', x:CX+50, y:5800, r:12, restitution:0.5});

  // ══ SECTION 7 (y 6000–7200): Comeback chaos ══

  // Entry ramps
  obs.push({type:'slope', x:0, y:6050, w:180, angle:0.70, friction:F, restitution:R});
  obs.push({type:'slope', x:W, y:6050, w:180, angle:-0.70, friction:F, restitution:R});

  // Oscillating gate (moves x 160-380, period 4 seconds)
  obs.push({type:'oscgate', x:CX, y:6300, w:100, xMin:160, xMax:380, period:4});

  // Wide catch bowl below gate
  obs.push({type:'slope', x:CX-160, y:6500, w:130, angle:0.65, friction:F, restitution:R});
  obs.push({type:'slope', x:CX+160, y:6500, w:130, angle:-0.65, friction:F, restitution:R});
  obs.push({type:'floor', x:CX, y:6580, w:120, h:20});

  // One more sweeper arm (speed 0.010)
  obs.push({type:'paddle', x:CX, y:6780, w:160, speed:0.010});

  // Recompression funnel (exit 80px)
  obs.push({type:'slope', x:0, y:6980, w:260, angle:0.78, friction:F, restitution:R});
  obs.push({type:'slope', x:W, y:6980, w:260, angle:-0.78, friction:F, restitution:R});

  // Peg below funnel
  obs.push({type:'peg', x:CX, y:7130, r:12, restitution:0.5});

  // ══ SECTION 8 (y 7300–8400): Tension section ══

  // Narrow alternating ramps forcing zigzag path
  // Ramp 1 — from left
  obs.push({type:'slope', x:0, y:7350, w:150, angle:0.70, friction:F, restitution:R});
  obs.push({type:'peg', x:CX+40, y:7450, r:12, restitution:0.5});
  obs.push({type:'peg', x:CX-40, y:7500, r:12, restitution:0.5});

  // Ramp 2 — from right
  obs.push({type:'slope', x:W, y:7600, w:150, angle:-0.70, friction:F, restitution:R});
  obs.push({type:'peg', x:CX-40, y:7700, r:12, restitution:0.5});
  obs.push({type:'peg', x:CX+40, y:7750, r:12, restitution:0.5});

  // Ramp 3 — from left
  obs.push({type:'slope', x:0, y:7850, w:150, angle:0.70, friction:F, restitution:R});
  obs.push({type:'peg', x:CX+40, y:7950, r:12, restitution:0.5});
  obs.push({type:'peg', x:CX-40, y:8000, r:12, restitution:0.5});

  // Ramp 4 — from right
  obs.push({type:'slope', x:W, y:8100, w:150, angle:-0.70, friction:F, restitution:R});

  // Final recompression bowl (exit 70px)
  obs.push({type:'slope', x:0, y:8250, w:260, angle:0.78, friction:F, restitution:R});
  obs.push({type:'slope', x:W, y:8250, w:260, angle:-0.78, friction:F, restitution:R});

  // ══ SECTION 9 (y 8500–9700): Final sprint ══

  // Two angled deflectors
  obs.push({type:'slope', x:0, y:8550, w:180, angle:0.70, friction:F, restitution:R});
  obs.push({type:'slope', x:W, y:8750, w:180, angle:-0.70, friction:F, restitution:R});

  // Pegs before finish chute
  obs.push({type:'peg', x:CX-40, y:8950, r:12, restitution:0.5});
  obs.push({type:'peg', x:CX+40, y:8950, r:12, restitution:0.5});

  // Narrow finish chute (walls 110px apart, 300px long, 20px thick walls)
  obs.push({type:'floor', x:CX-55, y:9200, w:20, h:300});
  obs.push({type:'floor', x:CX+55, y:9200, w:20, h:300});

  // ── Boundaries ──
  obs.push({type:'wall', x:-20, y:LEVEL_H/2, w:40, h:LEVEL_H});
  obs.push({type:'wall', x:W+20, y:LEVEL_H/2, w:40, h:LEVEL_H});
  obs.push({type:'floor', x:W/2, y:FINISH_Y+100, w:W, h:40});

  return obs;
}

// ════════════════════════════ MATTER.JS SETUP ════════════════════════════
const {Engine, World, Bodies, Body, Composite, Events, Constraint} = Matter;
let engine, world, tokenBodies=[], obsBodies=[], paddleBodies=[], oscGateBodies=[];

function createPhysics(){
  if(!engine){
    engine = Engine.create({gravity:{x:0, y:CFG.gravity}});
  } else {
    Composite.clear(engine.world);
    engine.gravity.y = CFG.gravity;
  }
  world = engine.world;
  tokenBodies = [];
  obsBodies = [];
  paddleBodies = [];
  oscGateBodies = [];

  // Tokens — start close together at center, same Y
  const t1 = Bodies.circle(W/2-20, 80, BALL_RADIUS, {
    restitution:0.2, friction:0.25, frictionAir:0.025, density:0.006, label:'p1',
    collisionFilter:{group:-1}
  });
  const t2 = Bodies.circle(W/2+20, 80, BALL_RADIUS, {
    restitution:0.2, friction:0.25, frictionAir:0.025, density:0.006, label:'p2',
    collisionFilter:{group:-2}
  });
  tokenBodies = [t1, t2];
  World.add(world, [t1, t2]);

  // Build obstacles
  const obstacles = buildObstacles();
  obstacles.forEach(o => {
    let body;
    switch(o.type){
      case 'peg': {
        const r = o.r || 10;
        body = Bodies.circle(o.x, o.y, r, {
          isStatic:true,
          restitution: o.restitution !== undefined ? o.restitution : 0.7,
          friction: o.friction !== undefined ? o.friction : 0.08,
          label:'peg', _pegR:r
        });
        break;
      }
      case 'floor': {
        body = Bodies.rectangle(o.x, o.y, o.w, o.h, {isStatic:true, restitution:0.3, label:'floor'});
        break;
      }
      case 'slope': {
        body = Bodies.rectangle(o.x + (o.angle>0?o.w/2:-o.w/2), o.y, o.w, 16, {
          isStatic:true,
          restitution: o.restitution !== undefined ? o.restitution : 0.2,
          friction: o.friction !== undefined ? o.friction : 0.08,
          angle:o.angle, label:'slope'
        });
        break;
      }
      case 'paddle': {
        body = Bodies.rectangle(o.x, o.y, o.w, 16, {
          isStatic:true, restitution:0.5, friction:0.01, label:'paddle'
        });
        body._paddleSpeed = o.speed || 0.02;
        paddleBodies.push(body);
        break;
      }
      case 'seesaw': {
        body = Bodies.rectangle(o.x, o.y, o.w, 16, {
          isStatic:false, restitution:0.2, friction:0.3, frictionAir:0.05,
          density:0.01, label:'seesaw'
        });
        body._pivotConstraint = Constraint.create({
          pointA:{x:o.x, y:o.y},
          bodyB:body,
          pointB:{x:0, y:0},
          stiffness:1, length:0
        });
        break;
      }
      case 'oscgate': {
        body = Bodies.rectangle(o.x, o.y, o.w || 80, o.h || 16, {
          isStatic:true, restitution:0.3, friction:0.1, label:'oscgate'
        });
        body._oscXMin = o.xMin;
        body._oscXMax = o.xMax;
        body._oscY = o.y;
        body._oscPeriod = o.period || 3;
        body._oscPhase = o.phase || 0;
        oscGateBodies.push(body);
        break;
      }
      case 'wall': {
        body = Bodies.rectangle(o.x, o.y, o.w, o.h, {isStatic:true, label:'wall'});
        break;
      }
    }
    if(body){
      obsBodies.push(body);
      World.add(world, body);
      if(body._pivotConstraint) World.add(world, body._pivotConstraint);
    }
  });
}

const imgs = {};

function loadImg(key, url){
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = ()=>{ imgs[key] = img; imgsLoaded++; };
  img.onerror = ()=>{ imgs[key] = null; imgsLoaded++; };

}

// ════════════════════════════ PARTICLES ════════════════════════════
let particles = [];

function spawnHitParticles(x, y, color){
  for(let i=0; i<6; i++){
    const a = Math.random()*Math.PI*2, spd = 1+Math.random()*3;
    particles.push({
      x, y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-1,
      size:2+Math.random()*3, color, life:1
    });
  }
}

function updateParticles(dt){
  for(let i=particles.length-1; i>=0; i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.08;
    p.life -= dt*2.5;
    if(p.life<=0) particles.splice(i,1);
  }
}

// ════════════════════════════ COLLISION EVENTS ════════════════════════════
function setupCollisionEvents(){
  Events.on(engine, 'collisionStart', (e)=>{
    e.pairs.forEach(pair=>{
      const labels = [pair.bodyA.label, pair.bodyB.label];
      let tokenBody = null, color = '';
      if(labels.includes('p1')){
        tokenBody = pair.bodyA.label==='p1' ? pair.bodyA : pair.bodyB;
        color = CFG.p1.color;
      } else if(labels.includes('p2')){
        tokenBody = pair.bodyA.label==='p2' ? pair.bodyA : pair.bodyB;
        color = CFG.p2.color;
      }
      if(tokenBody && (labels.includes('peg')||labels.includes('floor')||labels.includes('slope')||labels.includes('paddle')||labels.includes('seesaw')||labels.includes('oscgate'))){
        spawnHitParticles(tokenBody.position.x, tokenBody.position.y, color);
      }
    });
  });
}

// ════════════════════════════ DRAWING ════════════════════════════
function drawBackground(){
  // Sky gradient
  const gy = -camY*0.05;
  const grad = ctx.createLinearGradient(0, gy, 0, gy+H*1.5);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(0.5, '#B0E0FF');
  grad.addColorStop(1, '#E8F4FF');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Clouds parallax
  ctx.save();
  clouds.forEach(c=>{
    const cy = (c.y - camY*0.3) % (H+c.h*2) - c.h;
    ctx.globalAlpha = c.alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(c.x, cy, c.w/2, c.h/2, 0, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
}

function drawObstacles(){
  ctx.save();
  ctx.translate(0, -camY);

  obsBodies.forEach(b=>{
    if(b.label==='wall') return;
    const pos = b.position;

    // Skip if off-screen
    if(pos.y < camY-100 || pos.y > camY+H+100) return;

    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.rotate(b.angle);

    if(b.label==='peg'){
      const r = b._pegR || 12;
      const pg = ctx.createRadialGradient(0,0,0,0,0,r);
      pg.addColorStop(0,'#3a3a5e');pg.addColorStop(1,'#1a1a2e');
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
      ctx.fillStyle = pg; ctx.fill();
      ctx.strokeStyle = 'rgba(100,140,255,.3)';
      ctx.lineWidth = 1.5; ctx.stroke();
    } else if(b.label==='paddle'){
      // Sweeper arm — thick rounded rectangle with orange tip
      const hw = b.bounds.max.x - b.bounds.min.x;
      const armW = Math.max(hw, 160);
      const armH = 20;
      const tipLen = 20;
      // Main body — dark navy
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath();
      ctx.roundRect(-armW/2, -armH/2, armW - tipLen, armH, 6);
      ctx.fill();
      // Orange tip
      ctx.fillStyle = '#ff6b00';
      ctx.beginPath();
      ctx.roundRect(armW/2 - tipLen, -armH/2, tipLen, armH, [0,6,6,0]);
      ctx.fill();
      // Left orange tip (other end)
      ctx.fillStyle = '#ff6b00';
      ctx.beginPath();
      ctx.roundRect(-armW/2, -armH/2, tipLen, armH, [6,0,0,6]);
      ctx.fill();
      // Center pivot circle
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2);
      ctx.fillStyle = '#ff6b00'; ctx.fill();
      ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 2; ctx.stroke();
      // Outline
      ctx.strokeStyle = 'rgba(255,107,0,.4)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-armW/2, -armH/2, armW, armH);
    } else if(b.label==='oscgate'){
      // Oscillating gate — thick dark rectangle with orange end caps
      const gateW = 80, gateH = 20, capW = 10;
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(-gateW/2, -gateH/2, gateW, gateH);
      // Left cap
      ctx.fillStyle = '#ff6b00';
      ctx.beginPath();
      ctx.roundRect(-gateW/2, -gateH/2, capW, gateH, [4,0,0,4]);
      ctx.fill();
      // Right cap
      ctx.beginPath();
      ctx.roundRect(gateW/2 - capW, -gateH/2, capW, gateH, [0,4,4,0]);
      ctx.fill();
      // Outline
      ctx.strokeStyle = 'rgba(255,107,0,.4)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-gateW/2, -gateH/2, gateW, gateH);
    } else if(b.label==='seesaw'){
      // Seesaw — thick wood-colored plank with triangle pivot
      const plankW = 240, plankH = 20;
      // Plank
      ctx.fillStyle = '#4a3728';
      ctx.beginPath();
      ctx.roundRect(-plankW/2, -plankH/2, plankW, plankH, 4);
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,160,100,.4)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-plankW/2, -plankH/2, plankW, plankH);
      // Wood grain lines
      ctx.strokeStyle = 'rgba(80,50,30,.3)';
      ctx.lineWidth = 1;
      for(let g=-plankW/2+20; g<plankW/2; g+=30){
        ctx.beginPath(); ctx.moveTo(g, -plankH/2+3); ctx.lineTo(g+15, plankH/2-3); ctx.stroke();
      }
      // Triangle pivot underneath (drawn in world coords, not rotated)
      ctx.restore(); // exit rotation
      ctx.save();
      ctx.translate(pos.x, pos.y);
      // Draw triangle below pivot point
      ctx.fillStyle = '#2a2a4e';
      ctx.beginPath();
      ctx.moveTo(-16, 0);
      ctx.lineTo(16, 0);
      ctx.lineTo(0, 24);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(100,140,255,.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else {
      // Rectangle-based obstacles (slopes, floors)
      const verts = b.vertices;
      ctx.beginPath();
      ctx.moveTo(verts[0].x-pos.x, verts[0].y-pos.y);
      for(let i=1; i<verts.length; i++){
        ctx.lineTo(verts[i].x-pos.x, verts[i].y-pos.y);
      }
      ctx.closePath();
      ctx.fillStyle = '#1a1a2e';
      ctx.fill();
      ctx.strokeStyle = 'rgba(100,140,255,.15)';
      ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.restore();
  });

  // Finish line — thick checkered pattern at y=7400
  const fy = FINISH_Y - camY;
  if(fy > -80 && fy < H+80){
    const checkSize = 20;
    for(let cx=0; cx<W; cx+=checkSize){
      for(let r=0; r<3; r++){
        const isBlack = (Math.floor(cx/checkSize)+r)%2===0;
        ctx.fillStyle = isBlack ? '#111' : '#fff';
        ctx.fillRect(cx, FINISH_Y+r*checkSize-camY, checkSize, checkSize);
      }
    }
    ctx.save();
    ctx.font = '900 36px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.strokeText('FINISH', W/2, FINISH_Y-8-camY);
    ctx.fillText('FINISH', W/2, FINISH_Y-8-camY);
    ctx.restore();
  }

  ctx.restore();
}

function drawToken(body, cfg, idx){
  const px = body.position.x;
  const py = body.position.y - camY;

  // Skip if off-screen
  if(py < -60 || py > H+60) return;

  const r = BALL_RADIUS;
  const speed = Math.sqrt(body.velocity.x*body.velocity.x + body.velocity.y*body.velocity.y);
  const fast = speed > 8;

  // Speed trail — fading circles from trail history
  const trail = trailHistory[idx];
  if(trail.length > 1){
    ctx.save();
    ctx.fillStyle = cfg.color;
    const len = trail.length;
    for(let i=0; i<len-1; i++){
      const t = i / (len - 1); // 0 (oldest) to ~1 (newest)
      const baseAlpha = 0.1 + t * 0.5; // 0.1 to 0.6
      ctx.globalAlpha = fast ? Math.min(1, baseAlpha * 1.5) : baseAlpha;
      const trailR = r * (0.3 + t * 0.5); // shrinks for older positions
      const tx = trail[i].x;
      const ty = trail[i].y - camY;
      ctx.beginPath();
      ctx.arc(tx, ty, trailR, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Glow — brighter when fast
  ctx.save();
  ctx.globalAlpha = fast ? 0.5 : 0.3;
  const glowR = fast ? r*2.5 : r*2;
  ctx.beginPath(); ctx.arc(px, py, glowR, 0, Math.PI*2);
  const gg = ctx.createRadialGradient(px,py,0,px,py,glowR);
  gg.addColorStop(0, cfg.color); gg.addColorStop(1, 'transparent');
  ctx.fillStyle = gg; ctx.fill();
  ctx.restore();

  // Token circle — solid color + 2-letter initials
  ctx.save();
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2);
  ctx.fillStyle = cfg.color; ctx.fill();
  // Draw initials (first letter of each word, max 2)
  const initials = cfg.name.split(/\s+/).map(w=>w[0]).slice(0,2).join('');
  ctx.fillStyle = '#fff';
  ctx.font = '700 18px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(initials, px, py);
  ctx.restore();

  // 4px colored ring with outer glow
  ctx.save();
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2);
  ctx.strokeStyle = cfg.color; ctx.lineWidth = 4;
  ctx.shadowColor = cfg.color; ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.restore();
}

function drawParticlesOnScreen(){
  ctx.save();
  particles.forEach(p=>{
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath(); ctx.arc(p.x, p.y-camY, p.size, 0, Math.PI*2);
    ctx.fillStyle = p.color; ctx.fill();
  });
  ctx.restore();
}

function drawWinnerScreen(){
  if(winner<0) return;
  const t = Math.min(1, (performance.now()-winnerT)/800);
  const cfg = winner===0 ? CFG.p1 : CFG.p2;

  ctx.save();
  ctx.fillStyle = `rgba(0,0,0,${0.7*t})`;
  ctx.fillRect(0,0,W,H);

  if(t>0.15){
    const t2 = Math.min(1,(t-0.15)/0.85);
    ctx.globalAlpha = t2;

    // Winner face
    const bigR = 80;
    ctx.save();
    ctx.beginPath(); ctx.arc(W/2, H/2-80, bigR, 0, Math.PI*2); ctx.clip();
    const key = winner===0?'p1':'p2';
    if(imgs[key]){
      ctx.drawImage(imgs[key], W/2-bigR, H/2-80-bigR, bigR*2, bigR*2);
    } else {
      ctx.fillStyle = cfg.color; ctx.fill();
    }
    ctx.restore();

    ctx.beginPath(); ctx.arc(W/2, H/2-80, bigR, 0, Math.PI*2);
    ctx.strokeStyle = cfg.color; ctx.lineWidth = 5;
    ctx.shadowColor = cfg.color; ctx.shadowBlur = 40;
    ctx.stroke(); ctx.shadowBlur = 0;

    // Text
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 64px system-ui';
    ctx.fillStyle = cfg.color;
    ctx.shadowColor = cfg.color; ctx.shadowBlur = 50;
    ctx.fillText('WINS!', W/2, H/2+40);
    ctx.shadowBlur = 0;

    ctx.font = '700 28px system-ui';
    ctx.fillStyle = '#fff';
    ctx.fillText(cfg.name.toUpperCase(), W/2, H/2+90);

    // Countdown
    const remaining = Math.max(0, 5-(performance.now()-winnerT)/1000);
    if(remaining>0){
      ctx.font = '600 18px system-ui';
      ctx.fillStyle = 'rgba(200,220,255,.6)';
      ctx.fillText(`Restarting in ${Math.ceil(remaining)}...`, W/2, H/2+130);
    }
  }
  ctx.restore();
}

function drawHUD(){
  const cfgs = [CFG.p1, CFG.p2];
  const positions = tokenBodies.map(b=>b.position.y);
  const leader = positions[0] > positions[1] ? 0 : 1;

  const barH = 36;
  const thumbR = 24;
  const barY = 6;
  const barW = W/2 - 4; // each bar fills half the canvas width
  const pcts = [];

  ctx.save();

  for(let i=0; i<2; i++){
    const barX = i === 0 ? 2 : W/2 + 2;
    const pct = Math.min(100, Math.max(0, (positions[i]/FINISH_Y)*100));
    pcts.push(pct);

    // Bar background
    ctx.fillStyle = 'rgba(10,10,40,0.85)';
    roundRect(barX, barY, barW, barH, 6);
    ctx.fill();

    // Progress fill
    ctx.save();
    roundRect(barX, barY, barW, barH, 6); ctx.clip();
    ctx.fillStyle = cfgs[i].color;
    ctx.globalAlpha = 0.5;
    ctx.fillRect(barX, barY, barW*(pct/100), barH);
    ctx.globalAlpha = 1;
    ctx.restore();

    // Headshot thumbnail (24px radius)
    const thumbCX = i === 0 ? barX + 8 + thumbR : barX + barW - 8 - thumbR;
    const thumbCY = barY + barH/2;
    ctx.save();
    ctx.beginPath(); ctx.arc(thumbCX, thumbCY, thumbR, 0, Math.PI*2); ctx.clip();
    const imgKey = 'p'+(i+1);
    if(imgs[imgKey]){
      const img = imgs[imgKey];
      const scale = Math.max(thumbR*2/img.width, thumbR*2/img.height);
      const dw = img.width * scale;
      const dh = img.height * scale;
      ctx.drawImage(img, thumbCX - dw/2, thumbCY - dh/2 - dh*0.15, dw, dh);
    } else {
      ctx.fillStyle = cfgs[i].color;
      ctx.fillRect(thumbCX-thumbR, thumbCY-thumbR, thumbR*2, thumbR*2);
      ctx.fillStyle = '#fff';
      ctx.font = '700 18px system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const initials = cfgs[i].name.split(/\s+/).map(w=>w[0]).slice(0,2).join('');
      ctx.fillText(initials, thumbCX, thumbCY);
    }
    ctx.restore();
    // Thumbnail ring
    ctx.beginPath(); ctx.arc(thumbCX, thumbCY, thumbR, 0, Math.PI*2);
    ctx.strokeStyle = cfgs[i].color; ctx.lineWidth = 2; ctx.stroke();

    // Name + percentage text
    ctx.fillStyle = '#fff';
    ctx.font = '700 16px system-ui';
    ctx.textBaseline = 'middle';
    const nameStr = `${cfgs[i].name} ${Math.round(pct)}%`;
    if(i === 0){
      ctx.textAlign = 'left';
      ctx.fillText(nameStr, thumbCX + thumbR + 8, thumbCY);
    } else {
      ctx.textAlign = 'right';
      ctx.fillText(nameStr, thumbCX - thumbR - 8, thumbCY);
    }

    // Leader badge
    if(i===leader && phase==='race'){
      ctx.fillStyle = '#ffd700';
      ctx.font = '700 12px system-ui';
      if(i === 0){
        ctx.textAlign = 'right';
        ctx.fillText('▲ LEAD', barX + barW - 8, thumbCY);
      } else {
        ctx.textAlign = 'left';
        ctx.fillText('▲ LEAD', barX + 8, thumbCY);
      }
    }
  }

  // Gap indicator — centered between bars
  if(phase==='race'){
    const gap = Math.abs(pcts[0] - pcts[1]);
    ctx.textAlign = 'center';
    ctx.font = '700 13px system-ui';
    ctx.textBaseline = 'middle';
    const gapY = barY + barH + 16;
    if(gap < 3){
      ctx.fillStyle = '#ff4444';
      ctx.fillText('NECK AND NECK', W/2, gapY);
    } else if(gap <= 15){
      ctx.fillStyle = 'rgba(255,255,255,.8)';
      ctx.fillText(`GAP: ${Math.round(gap)}%`, W/2, gapY);
    } else {
      ctx.fillStyle = '#ff8c00';
      ctx.fillText('RUNAWAY!', W/2, gapY);
    }
  }

  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ════════════════════════════ DRAMA EFFECTS ════════════════════════════
function drawLeadChange(){
  if(leadChangeT <= 0) return;
  const elapsed = (performance.now() - leadChangeT) / 1000;
  if(elapsed > 2){ leadChangeT = 0; return; }
  const alpha = 1 - (elapsed / 2);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '900 52px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd700';
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 10;
  ctx.fillText('LEAD CHANGE!', W/2, H*0.3);
  ctx.restore();
}

function drawCheckpointFlash(){
  if(!checkpointFlash.active) return;
  const elapsed = (performance.now() - checkpointFlash.t) / 1000;
  if(elapsed > 1.5){ checkpointFlash.active = false; return; }
  const alpha = 1 - (elapsed / 1.5);
  // Custom messages per checkpoint
  let msg = '';
  if(checkpointFlash.pct === 50) msg = 'HALFWAY!';
  else if(checkpointFlash.pct === 75) msg = 'ALMOST THERE!';
  else if(checkpointFlash.pct === 90) msg = 'FINAL STRETCH!';
  else msg = `CHECKPOINT ${checkpointFlash.pct}%`;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '900 36px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = checkpointFlash.color;
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 8;
  ctx.fillText(msg, W/2, H*0.45);
  ctx.restore();
}

function drawDangerWarnings(now){
  if(dangerWarnings.length === 0) return;
  ctx.save();
  ctx.font = '900 20px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 6;
  dangerWarnings.forEach(w => {
    const elapsed = (now - w.t) / 1000;
    const alpha = 1 - (elapsed / 0.5);
    if(alpha <= 0) return;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ff6b00';
    ctx.fillText('DANGER!', w.x, w.y - camY - 45);
  });
  ctx.restore();
}

function drawSlowMoIndicator(){
  if(!slowMoActive) return;
  ctx.save();
  const pulse = 0.5 + 0.3 * Math.sin(performance.now() / 200);
  ctx.globalAlpha = pulse;
  ctx.font = '900 18px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#ff8c00';
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 4;
  ctx.fillText('SLOW-MO', W/2, H - 40);
  ctx.restore();
}

function drawVignette(){
  const p0 = Math.min(100, Math.max(0, (tokenBodies[0].position.y/FINISH_Y)*100));
  const p1 = Math.min(100, Math.max(0, (tokenBodies[1].position.y/FINISH_Y)*100));
  if(p0 < 80 && p1 < 80) return;
  const pulse = 0.3 + 0.15 * Math.sin(performance.now() / 400);
  ctx.save();
  const grad = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.75);
  grad.addColorStop(0, 'rgba(255,0,0,0)');
  grad.addColorStop(1, `rgba(180,0,0,${pulse})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ════════════════════════════ GAME LOOP ════════════════════════════
let lastT = 0;

function loop(now){
  const dt = Math.min((now-lastT)/1000, 0.05);
  lastT = now;

  // Physics
  if(phase==='race'){
    // Slow-mo effect — decay back to 1x
    if(slowMoActive && now >= slowMoEnd){
      slowMoActive = false; slowMoScale = 1;
    }
    const timeScale = slowMoActive ? 0.6 : 1;
    Engine.update(engine, dt*1000*timeScale);

    // Rotate paddles
    paddleBodies.forEach(b => Body.setAngle(b, b.angle + b._paddleSpeed));
    // Oscillating gates
    oscGateBodies.forEach(b => {
      const t = performance.now()/1000;
      const s = Math.sin((t / b._oscPeriod + b._oscPhase) * Math.PI * 2);
      const nx = (b._oscXMin + b._oscXMax)/2 + s * (b._oscXMax - b._oscXMin)/2;
      Body.setPosition(b, {x:nx, y:b._oscY});
    });

    // Record trail positions
    for(let i=0; i<2; i++){
      const p = tokenBodies[i].position;
      trailHistory[i].push({x:p.x, y:p.y});
      if(trailHistory[i].length > 8) trailHistory[i].shift();
    }

    // Max speed cap — keep action readable
    const MAX_SPEED = 8;
    for(let i=0; i<2; i++){
      const tb = tokenBodies[i];
      const spd = Math.sqrt(tb.velocity.x*tb.velocity.x + tb.velocity.y*tb.velocity.y);
      if(spd > MAX_SPEED){
        const scale = MAX_SPEED / spd;
        Body.setVelocity(tb, {x:tb.velocity.x*scale, y:tb.velocity.y*scale});
      }
    }

    // Downward nudge + win% bias force
    const biases = [(CFG.p1.winBias||50)/100, (CFG.p2.winBias||50)/100];
    for(let i=0; i<2; i++){
      const tb = tokenBodies[i];
      if(tb.velocity.y < 1){
        Body.applyForce(tb, tb.position, {x:0, y:0.003});
      }
      // Slight downward bias based on win% (max ±0.0008)
      const bForce = (biases[i]-0.5)*0.0016;
      if(Math.abs(bForce)>0.0001){
        Body.applyForce(tb, tb.position, {x:0, y:bForce});
      }
    }

    // Stuck prevention: if ball moved < 5px in 3 seconds, unstick it
    if(now - stuckCheckTime > 3000){
      for(let i=0; i<2; i++){
        const tb = tokenBodies[i];
        const dx = tb.position.x - stuckLastPos[i].x;
        const dy = tb.position.y - stuckLastPos[i].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 5){
          Body.setVelocity(tb, {x: (Math.random()*6)-3, y: -8});
        }
        stuckLastPos[i] = {x:tb.position.x, y:tb.position.y};
      }
      stuckCheckTime = now;
    }

    // Danger proximity warnings — check ball distance to moving obstacles
    const movingObs = [...paddleBodies, ...oscGateBodies];
    for(let i=0; i<2; i++){
      const tb = tokenBodies[i];
      for(const mob of movingObs){
        const dx = tb.position.x - mob.position.x;
        const dy = tb.position.y - mob.position.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 80){
          // Only add warning if no recent warning exists nearby
          const hasRecent = dangerWarnings.some(w =>
            Math.abs(w.x - tb.position.x) < 40 &&
            Math.abs(w.y - tb.position.y) < 40 &&
            now - w.t < 500
          );
          if(!hasRecent){
            dangerWarnings.push({x:tb.position.x, y:tb.position.y, t:now});
          }
        }
      }
    }
    // Expire old warnings
    dangerWarnings = dangerWarnings.filter(w => now - w.t < 500);

    // Slow-mo tension — when balls are split across a moving obstacle
    if(!slowMoActive){
      for(const mob of movingObs){
        const y0 = tokenBodies[0].position.y;
        const y1 = tokenBodies[1].position.y;
        const my = mob.position.y;
        // One ball above, one below (within 300px of obstacle)
        const above0 = y0 < my && my - y0 < 300;
        const below0 = y0 > my && y0 - my < 300;
        const above1 = y1 < my && my - y1 < 300;
        const below1 = y1 > my && y1 - my < 300;
        if((above0 && below1) || (above1 && below0)){
          slowMoActive = true;
          slowMoEnd = now + 2000;
          slowMoScale = 0.6;
          break;
        }
      }
    }

    // Check winner
    for(let i=0; i<2; i++){
      if(tokenBodies[i].position.y >= 9750 && winner<0){
        winner = i;
        winnerT = performance.now();
        phase = 'win';
        autoRestartT = now + 5000;

        // Auto-stop recording if active
        if(rActive) setTimeout(()=>stopRec(), 1500);
      }
    }

    // Lead change detection
    const curLeader = tokenBodies[0].position.y > tokenBodies[1].position.y ? 0 : 1;
    if(lastLeader >= 0 && curLeader !== lastLeader){
      leadChangeT = performance.now();
    }
    lastLeader = curLeader;

    // Checkpoint detection
    const cpThresholds = [50, 75, 90];
    for(let i=0; i<2; i++){
      const pct = Math.min(100, (tokenBodies[i].position.y / FINISH_Y) * 100);
      for(let c=0; c<3; c++){
        if(!checkpointsPassed[i][c] && pct >= cpThresholds[c]){
          checkpointsPassed[i][c] = true;
          checkpointFlash = {active:true, t:performance.now(), color:i===0?CFG.p1.color:CFG.p2.color, pct:cpThresholds[c]};
        }
      }
    }

    // Camera follows leading token
    const leadY = Math.max(tokenBodies[0].position.y, tokenBodies[1].position.y);
    const targetCam = Math.max(0, leadY - H*0.55);
    camY += (targetCam - camY) * 0.06;
  }

  if(phase==='win' && now >= autoRestartT){
    restartRace();
  }

  // Update particles
  updateParticles(dt);

  // Draw
  drawBackground();
  drawObstacles();
  drawToken(tokenBodies[0], CFG.p1, 0);
  drawToken(tokenBodies[1], CFG.p2, 1);
  drawParticlesOnScreen();
  drawHUD();
  drawDangerWarnings(now);
  drawSlowMoIndicator();
  drawLeadChange();
  drawCheckpointFlash();
  drawVignette();
  if(phase==='win') drawWinnerScreen();

  requestAnimationFrame(loop);
}

// ════════════════════════════ RECORDING ════════════════════════════
let mRec=null, rChunks=[], rActive=false;

function toggleRec(){ rActive ? stopRec() : startRec(); }

function startRec(){
  if(!canvas.captureStream){alert('Recording not supported.');return;}
  rChunks=[];
  const stream = canvas.captureStream(24);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9' : 'video/webm';
  mRec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:4000000});
  mRec.ondataavailable = e=>{ if(e.data&&e.data.size>0) rChunks.push(e.data); };
  mRec.start(1000);
  rActive = true;
  document.getElementById('recBtn').textContent = '⏹ STOP';
  document.getElementById('recBtn').style.color = '#ff5566';
  document.getElementById('recDot').style.display = 'block';
  restartRace();
}

function stopRec(){
  rActive = false;
  document.getElementById('recBtn').textContent = '⏺ REC';
  document.getElementById('recBtn').style.color = '';
  document.getElementById('recDot').style.display = 'none';
  if(mRec && mRec.state==='recording'){
    mRec.onstop = ()=>{
      if(rChunks.length===0) return;
      const blob = new Blob(rChunks, {type:mRec.mimeType||'video/webm'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'marble-race.webm';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},5000);
    };
    try{mRec.requestData();}catch(e){}
    mRec.stop();
  }
}

// ════════════════════════════ MODAL / CONFIG ════════════════════════════
let _allPlayers = null;
let _searchTarget = 1; // which player slot search fills

function openModal(){
  document.getElementById('name1').value = CFG.p1.name;
  document.getElementById('url1').value = CFG.p1.img;
  document.getElementById('prev1').src = CFG.p1.img;
  document.getElementById('color1').value = CFG.p1.color;
  document.getElementById('win1').value = CFG.p1.winBias||50;
  document.getElementById('winLbl1').textContent = CFG.p1.winBias||50;
  document.getElementById('name2').value = CFG.p2.name;
  document.getElementById('url2').value = CFG.p2.img;
  document.getElementById('prev2').src = CFG.p2.img;
  document.getElementById('color2').value = CFG.p2.color;
  document.getElementById('win2').value = CFG.p2.winBias||50;
  document.getElementById('winLbl2').textContent = CFG.p2.winBias||50;
  hideSearch();
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
}

function handleFile(idx, input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    document.getElementById('url'+idx).value = e.target.result;
    document.getElementById('prev'+idx).src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function applyConfig(){
  CFG.p1.name = document.getElementById('name1').value || 'Player 1';
  CFG.p1.img = document.getElementById('url1').value;
  CFG.p1.color = document.getElementById('color1').value;
  CFG.p1.winBias = parseInt(document.getElementById('win1').value)||50;
  CFG.p2.name = document.getElementById('name2').value || 'Player 2';
  CFG.p2.img = document.getElementById('url2').value;
  CFG.p2.color = document.getElementById('color2').value;
  CFG.p2.winBias = parseInt(document.getElementById('win2').value)||50;

  // Reload images
  imgs.p1 = null; imgs.p2 = null;
  imgsLoaded = 0;
  loadImg('p1', CFG.p1.img);
  loadImg('p2', CFG.p2.img);

  closeModal();
  restartRace();
}

// Player search
async function loadPlayersDB(){
  if(_allPlayers) return _allPlayers;
  try{
    const resp = await fetch('https://jsierrahoopshype.github.io/nba-headshots/metadata/players.json');
    _allPlayers = await resp.json();
    return _allPlayers;
  }catch(e){
    console.warn('Failed to load players.json:', e);
    _allPlayers = [];
    return [];
  }
}

function showSearch(idx){
  _searchTarget = idx;
  // Highlight active search button
  document.querySelectorAll('.search-for').forEach(el=>el.classList.remove('active'));
  document.querySelector('#pc'+idx+' .search-for').classList.add('active');
  document.getElementById('search-panel').style.display = '';
  document.getElementById('search-panel-title').textContent = 'Search NBA Players → Player '+idx;
  document.getElementById('search-box').value = '';
  document.getElementById('search-results').innerHTML = '<div style="color:#6a8ab0;font:12px system-ui;padding:8px">Loading players...</div>';
  document.getElementById('search-box').focus();
  loadPlayersDB().then(()=>filterPlayers(''));
}

function hideSearch(){
  document.getElementById('search-panel').style.display = 'none';
  document.querySelectorAll('.search-for').forEach(el=>el.classList.remove('active'));
}

function filterPlayers(query){
  if(!_allPlayers) return;
  const q = query.toLowerCase().trim();
  const results = q.length < 2
    ? _allPlayers.slice(0, 30)
    : _allPlayers.filter(p=>(p.name||'').toLowerCase().includes(q)).slice(0,30);

  const container = document.getElementById('search-results');
  if(results.length === 0){
    container.innerHTML = '<div style="color:#6a8ab0;font:12px system-ui;padding:8px">No players found</div>';
    return;
  }
  container.innerHTML = results.map(p=>{
    const slug = p.slug || p.id || '';
    const imgUrl = slug ? `https://nba-battle.thejorgesierra.workers.dev/headshot/${slug}.png` : '';
    return `<div class="sr-item" onclick="pickPlayer('${(p.name||'').replace(/'/g,"\\'")}','${imgUrl}')">
      <img src="${imgUrl}" onerror="this.style.display='none'">
      <span>${p.name||'Unknown'}</span>
    </div>`;
  }).join('');
}

function pickPlayer(name, imgUrl){
  const idx = _searchTarget;
  document.getElementById('name'+idx).value = name;
  document.getElementById('url'+idx).value = imgUrl;
  document.getElementById('prev'+idx).src = imgUrl;
  hideSearch();
}

// ════════════════════════════ INIT ════════════════════════════
createPhysics();
setupCollisionEvents();

// Preload images before starting race — show loading screen
let _preloadDone = false;
const _preloadStart = performance.now();

function drawLoadingScreen(){
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#87CEEB';
  ctx.font = '700 28px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Loading...', W/2, H/2);
  ctx.font = '400 16px system-ui';
  ctx.fillStyle = 'rgba(200,220,255,.5)';
  ctx.fillText('Preparing headshots', W/2, H/2 + 40);
}

function preloadLoop(now){
  const elapsed = now - _preloadStart;
  const bothLoaded = imgsLoaded >= 2;
  const timedOut = elapsed > 3000;
  if(bothLoaded || timedOut){
    _preloadDone = true;
    lastT = performance.now();
    requestAnimationFrame(loop);
    return;
  }
  drawLoadingScreen();
  requestAnimationFrame(preloadLoop);
}
requestAnimationFrame(preloadLoop);
</script>
